language: en-US
tone_instructions: "This is a published PyPI package with real users - flag any change that could break the public API or reindexing behavior."
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    ignore_usernames: ["dependabot[bot]"]
    auto_incremental_review: true
  path_filters:
    - "!**/*.pyc"
    - "!**/__pycache__/**"
    - "!dist/**"
    - "!.venv/**"
  path_instructions:
    - path: "src/**/*.py"
      instructions: >
        Flag any change to public API signatures (pyproject.toml exports,
        __init__.py re-exports) without a corresponding version bump note.
        This project has had real correctness regressions in its call-graph
        indexing - scrutinize index/reindex logic for off-by-one and
        cross-reference bugs.
    - path: "tests/**/*.py"
      instructions: "Require regression tests for any bug fix; check pytest markers and fixture scope."
  tools:
    ruff:
      enabled: true
    semgrep:
      enabled: true
    gitleaks:
      enabled: true

knowledge_base:
  learnings:
    scope: local
