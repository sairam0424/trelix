[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trelix_langchain"]

[project]
name = "trelix-langchain"
version = "3.5.1"
description = "LangChain retriever for trelix code intelligence"
readme = "README.md"
# `license` and the License classifier are what PyPI renders, NOT the shipped file.
# hatchling has always put LICENSE in the wheel (`License-File: LICENSE` in METADATA),
# yet with no `license` field and no classifier, pypi.org/project/trelix-langchain/
# showed "License: UNSPECIFIED" for all 7 releases up to and including 2.4.0 — the
# MIT grant was in the artifact but invisible to anyone vetting the dependency.
license = { file = "LICENSE" }
authors = [{ name = "Trelix Contributors" }]
requires-python = ">=3.12"
keywords = ["langchain", "retriever", "rag", "code-search", "code-intelligence", "llm", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The floor was `trelix>=0.4.0`, which is unsatisfiable-as-written and far too low:
# trelix 0.4.0 was never published (the oldest core on PyPI is 0.5.0), so pip silently
# resolved the floor to 0.5.0 — two majors and 25 releases behind the tree this ships
# from. Nothing here catches that: retriever.py reads `IndexConfig`/`EmbedderConfig` and
# `SearchResult`/`RetrievedContext` attributes directly, but tests/test_retriever.py
# mocks the core wholesale, so the suite passes against a core that isn't installed.
# 3.0.0 was the lowest published core verified to expose every name used here.
#
# trelix>=3.5.0 (v3.5.0): retriever.py imports `require_index` from trelix.core.index_check
# inside _get_trelix_retriever, and that module is not in the last core before 3.5.0 (3.4.3).
# Against an older core the adapter installs and imports, then fails at the first query, and a
# machine that already held that core satisfied the old floor, so `pip install -U
# trelix-langchain` kept it. tests/unit/test_release_version_gate.py
# (TestSatelliteCoreFloorsFollowTheCore) fails a release that bumps the version without this.
dependencies = ["trelix>=3.5.0", "langchain-core>=0.1.0"]

[project.urls]
Homepage = "https://github.com/sairam0424/trelix"
