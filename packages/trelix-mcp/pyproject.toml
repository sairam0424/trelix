[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trelix_mcp"]

[project]
name = "trelix-mcp"
version = "3.1.5"
description = "MCP server for trelix — semantic code search for Claude Code, Cursor, Windsurf, Continue.dev"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Trelix Contributors" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "code-search", "claude-code", "cursor", "code-intelligence", "llm", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The floor was `trelix>=2.8.0` and had been false since v2.8.1. The server calls five core
# APIs that do not exist at 2.8.0, established by grepping each one across every tag rather
# than by reading release notes:
#   Database.get_symbol_ids_for_file_id  (server.py:508)  first shipped v3.1.2  <- binding
#   plan_from_intent_hint                (server.py:315)  first shipped v2.10.0
#   RetrievalConfig.federation_max_repos (server.py:767)  first shipped v2.8.1
#   FederatedRetriever.repos_queried_count (server.py:858) first shipped v2.8.1
#   RepoRegistry.add(..., max_repos=)                      first shipped v2.8.1
# So `pip install trelix-mcp` could resolve core 2.8.0 and every search_code call would fail
# on a missing attribute. Raised to the newest requirement, not to the current version:
# lockstep governs the version STAMP, not this floor. Distinct from the v2.7.1 regression,
# where floors were raised on an assumption — this one is raised on measured absence.
dependencies = ["trelix>=3.1.2", "mcp>=1.24.0,<2.0", "fastmcp>=3.4.0,<4"]

[project.scripts]
trelix-mcp = "trelix_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sairam0424/trelix"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
