# GitHub App manifest — register via https://github.com/settings/apps/new
# (or an organization's equivalent) using GitHub's "manifest flow":
# POST this as form data to https://github.com/settings/apps/new, or paste
# it into the manifest-flow UI. See:
# https://docs.github.com/en/apps/sharing-github-apps/registering-a-github-app-from-a-manifest
#
# No redirect_url/setup_url: this App has no /setup callback route:
# GitHub's manifest flow displays the one-time `code` for manual exchange
# without them (see README.md's registration step).
name: trelix-review
url: https://trelix-github-app-production.up.railway.app
description: >-
  Automatic PR code review as GitHub Check annotations, powered by trelix's
  retrieval-augmented diff analysis. Zero setup beyond installing the App —
  no workflow YAML required in the installing repository.
public: true

hook_attributes:
  url: https://trelix-github-app-production.up.railway.app/webhooks/github
  active: true

# What the App itself holds. It never holds more than it uses: it reads a PR's
# files (pull_requests: read; the `pull_request` event needs it too), fetches
# the PR head (contents: read) and creates Check runs (checks: write). It does
# not comment on or edit pull requests, so it has no pull_requests: write.
#
# Each review mints three installation tokens from these, each limited to the
# one repository the PR is in and to one job (src/auth.ts, README "Token
# scopes"): checkout = contents:read, review = pull_requests:read, posting
# the Check = checks:write (each with metadata:read, which every token has).
#
# Registering from this file sets these on a NEW App. An existing App's
# permissions are changed by its owner in Settings -> Developer settings ->
# GitHub Apps -> Permissions & events: pull_requests write -> read there.
default_permissions:
  pull_requests: read
  checks: write
  contents: read

default_events:
  - pull_request
