# CodeQL configuration for .github/workflows/codeql.yml.
#
# Every entry in paths-ignore needs its reason written here.
#
# tests/fixtures/mini_repo is sample source that tests/integration/test_eval.py and
# tests/e2e/test_mcp_stdio_e2e.py copy to a temporary directory and index as DATA: nothing
# imports or runs it. Its auth.py hashes a salted password with plain SHA-256, which CodeQL
# reports as py/weak-sensitive-data-hashing. The evaluation test ranks the chunks of this
# fixture for fixed queries, so its lines are not edited. Nothing else under tests/fixtures
# is excluded.
name: trelix CodeQL configuration
paths-ignore:
  - tests/fixtures/mini_repo/**
