name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    name: Build trelix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: trelix-macos-arm64
            binary-path: dist/trelix
          - os: windows-latest
            artifact-name: trelix-windows-x64
            binary-path: dist/trelix.exe
          - os: ubuntu-latest
            artifact-name: trelix-linux-x64
            binary-path: dist/trelix
          - os: ubuntu-24.04-arm
            artifact-name: trelix-linux-arm64
            binary-path: dist/trelix
          # windows-11-arm intentionally excluded: tree-sitter-languages and
          # sqlite-vec (unconditional deps) publish no win_arm64 wheel or
          # sdist, so pip install fails before the build ever runs.

    steps:
      - uses: actions/checkout@v4

      # macOS only: actions/setup-python's macOS interpreter builds sqlite3
      # without SQLITE_ENABLE_LOAD_EXTENSION, so any bundled trelix binary
      # crashes on its first real index/search call with
      # "'sqlite3.Connection' object has no attribute 'enable_load_extension'"
      # (sqlite-vec loads via conn.enable_load_extension()) — confirmed via
      # direct reproduction; a uv-provisioned python-build-standalone
      # interpreter supports it. Windows/Linux are unaffected, so only
      # macOS's provisioning step changes. See build-binaries.yml.
      - name: Set up uv (macOS — needs a Python with sqlite3 load-extension support)
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.11"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # --managed-python is required — see build-binaries.yml's comment.
          uv venv --python 3.11 --managed-python .venv-build
          source .venv-build/bin/activate
          uv pip install -e ".[local]" pyinstaller

      - name: Install dependencies (Windows/Linux)
        if: runner.os != 'macOS'
        run: pip install -e ".[local]" && pip install pyinstaller

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: |
          source .venv-build/bin/activate
          pyinstaller trelix.spec --clean --noconfirm

      - name: Build binary (Windows/Linux)
        if: runner.os != 'macOS'
        run: pyinstaller trelix.spec --clean --noconfirm

      # The binary excludes sentence-transformers/torch (trelix.spec) to stay
      # small, so --provider local can never work here — real local
      # embedding is verified separately (pytest, `pip install trelix[local]`).
      # --provider openai with a bogus key still reaches SQLiteVectorStore's
      # sqlite-vec load *before* the network call, so it still catches a
      # sqlite3 enable_load_extension regression; asserting on the literal
      # crash string (not exit code) keeps this smoke test working even
      # when the runner has no outbound network access to OpenAI.
      - name: Verify binary (macOS)
        if: runner.os == 'macOS'
        run: |
          file dist/trelix
          ./dist/trelix --help
          ./dist/trelix --version
          mkdir -p /tmp/trelix-smoke/repo
          printf 'def add(a, b):\n    """Add two numbers."""\n    return a + b\n' > /tmp/trelix-smoke/repo/util.py
          (OPENAI_API_KEY=sk-fake-key-for-ci-smoke-test ./dist/trelix index /tmp/trelix-smoke/repo --provider openai || true) 2>&1 | tee /tmp/trelix-smoke.log
          grep -q "enable_load_extension" /tmp/trelix-smoke.log && { echo "sqlite3 enable_load_extension regression detected"; exit 1; } || true
          ./dist/trelix stats /tmp/trelix-smoke/repo | grep -q "Symbols"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist/trelix.exe --help
          dist/trelix.exe --version
          mkdir -p /tmp/trelix-smoke/repo
          printf 'def add(a, b):\n    """Add two numbers."""\n    return a + b\n' > /tmp/trelix-smoke/repo/util.py
          (OPENAI_API_KEY=sk-fake-key-for-ci-smoke-test dist/trelix.exe index /tmp/trelix-smoke/repo --provider openai || true) 2>&1 | tee /tmp/trelix-smoke.log
          grep -q "enable_load_extension" /tmp/trelix-smoke.log && { echo "sqlite3 enable_load_extension regression detected"; exit 1; } || true
          dist/trelix.exe stats /tmp/trelix-smoke/repo | grep -q "Symbols"

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        run: |
          file dist/trelix
          ./dist/trelix --help
          ./dist/trelix --version
          mkdir -p /tmp/trelix-smoke/repo
          printf 'def add(a, b):\n    """Add two numbers."""\n    return a + b\n' > /tmp/trelix-smoke/repo/util.py
          (OPENAI_API_KEY=sk-fake-key-for-ci-smoke-test ./dist/trelix index /tmp/trelix-smoke/repo --provider openai || true) 2>&1 | tee /tmp/trelix-smoke.log
          grep -q "enable_load_extension" /tmp/trelix-smoke.log && { echo "sqlite3 enable_load_extension regression detected"; exit 1; } || true
          ./dist/trelix stats /tmp/trelix-smoke/repo | grep -q "Symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-path }}
          retention-days: 30

  build-distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build trelix
        run: python -m build

      - name: Check trelix distributions
        run: twine check dist/*

      - name: Upload trelix distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-dist
          path: dist/
          retention-days: 7

      - name: Build trelix-mcp
        run: cd packages/trelix-mcp && python -m build

      - name: Check trelix-mcp distributions
        run: twine check packages/trelix-mcp/dist/*

      - name: Upload trelix-mcp distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-mcp-dist
          path: packages/trelix-mcp/dist/
          retention-days: 7

      - name: Build trelix-langchain
        run: cd packages/trelix-langchain && python -m build

      - name: Check trelix-langchain distributions
        run: twine check packages/trelix-langchain/dist/*

      - name: Upload trelix-langchain distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-langchain-dist
          path: packages/trelix-langchain/dist/
          retention-days: 7

      - name: Build trelix-llama-index
        run: cd packages/trelix-llama-index && python -m build

      - name: Check trelix-llama-index distributions
        run: twine check packages/trelix-llama-index/dist/*

      - name: Upload trelix-llama-index distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-llama-index-dist
          path: packages/trelix-llama-index/dist/
          retention-days: 7

  publish:
    name: Publish to PyPI & GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-distributions]
    environment: pypi
    permissions:
      id-token: write    # OIDC trusted publisher (PyPI) — scoped to publish job only
      contents: write    # create GitHub Release + upload assets

    steps:
      - name: Download trelix distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-dist
          path: dist/

      - name: Download trelix-mcp distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-mcp-dist
          path: packages/trelix-mcp/dist/

      - name: Download trelix-langchain distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-langchain-dist
          path: packages/trelix-langchain/dist/

      - name: Download trelix-llama-index distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-llama-index-dist
          path: packages/trelix-llama-index/dist/

      - name: Publish trelix to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
          attestations: true

      - name: Publish trelix-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: packages/trelix-mcp/dist/
          skip-existing: true
          attestations: true

      - name: Publish trelix-langchain to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: packages/trelix-langchain/dist/
          skip-existing: true
          attestations: true

      - name: Publish trelix-llama-index to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: packages/trelix-llama-index/dist/
          skip-existing: true
          attestations: true

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-macos-arm64
          path: release-assets/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-windows-x64
          path: release-assets/windows

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-linux-x64
          path: release-assets/linux

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-linux-arm64
          path: release-assets/linux-arm64

      - name: Rename binaries to unique release asset names
        # softprops/action-gh-release uploads by basename — macOS's and Linux's
        # binaries are both called "trelix", so without renaming they collide
        # into a single asset and one platform's binary silently disappears.
        run: |
          mv release-assets/macos/trelix release-assets/macos/trelix-macos-arm64
          mv release-assets/windows/trelix.exe release-assets/windows/trelix-windows-x64.exe
          mv release-assets/linux/trelix release-assets/linux/trelix-linux-x64
          mv release-assets/linux-arm64/trelix release-assets/linux-arm64/trelix-linux-arm64

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/trelix-macos-arm64
            release-assets/windows/trelix-windows-x64.exe
            release-assets/linux/trelix-linux-x64
            release-assets/linux-arm64/trelix-linux-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
