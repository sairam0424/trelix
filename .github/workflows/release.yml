name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate everything on the tag matching what the tree is actually stamped as.
  #
  # Without this, tagging v3.2.0 on a tree still stamped 3.1.2 builds `trelix-3.1.2`,
  # every publish step below sets `skip-existing: true` and therefore SKIPS it as already
  # present, and the run goes GREEN with a GitHub Release full of binaries and zero new
  # packages. Nothing in the logs says "published nothing". `skip-existing` is kept — it
  # is what makes a re-run after a partial failure safe — so the guard has to be here
  # instead.
  #
  # It checks all twelve version stamps, which live across eleven files (server.json carries
  # two). That covers a class the old release checklist structurally could not: it told
  # contributors to grep for the PREVIOUS version, which by construction never matches a
  # stamp already stranded on an older line. Every stamp that had actually drifted was of
  # exactly that class — helm/trelix/values.yaml's image.tag (the chart advertised
  # appVersion 3.1.2 while deploying 2.12.0), packages/trelix-mcp/server.json (both fields),
  # and both adapters, frozen at 2.4.0 while the jobs below shipped them on every core tag.
  # CONTRIBUTING.md now documents printing every stamp instead of grepping for one.
  verify-version:
    name: Verify tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against every version site
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          echo "tag: $tag"

          fail=0
          check() {  # check <label> <actual> <path>
            if [ "$2" != "$tag" ]; then
              echo "::error file=$3::$1 is '$2' but the tag says '$tag'"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }

          check "pyproject.toml version" \
            "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" \
            pyproject.toml
          check "src/trelix/__init__.py __version__" \
            "$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"",open("src/trelix/__init__.py").read()).group(1))')" \
            src/trelix/__init__.py
          check "helm Chart.yaml appVersion" \
            "$(python -c 'import re;print(re.search(r"^appVersion:\s*\"?([^\"\s]+)\"?",open("helm/trelix/Chart.yaml").read(),re.M).group(1))')" \
            helm/trelix/Chart.yaml
          check "helm values.yaml image.tag" \
            "$(python -c 'import re;print(re.search(r"^\s+tag:\s*\"?([^\"\s]+)\"?",open("helm/trelix/values.yaml").read(),re.M).group(1))')" \
            helm/trelix/values.yaml
          check "trelix-mcp pyproject.toml version" \
            "$(python -c 'import tomllib;print(tomllib.load(open("packages/trelix-mcp/pyproject.toml","rb"))["project"]["version"])')" \
            packages/trelix-mcp/pyproject.toml
          # This one was documented as "the one exception it does not check — verify it by
          # hand until that check is added". Hand-verification of a stamp that ships is the
          # same silent-mis-publish risk as the adapters had, so it is checked here instead.
          check "trelix-mcp __version__" \
            "$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"",open("packages/trelix-mcp/src/trelix_mcp/__init__.py").read()).group(1))')" \
            packages/trelix-mcp/src/trelix_mcp/__init__.py

          # server.json carries the version in two places.
          check "trelix-mcp server.json (version)" \
            "$(python -c 'import json;print(json.load(open("packages/trelix-mcp/server.json"))["version"])')" \
            packages/trelix-mcp/server.json
          check "trelix-mcp server.json (packages[0].version)" \
            "$(python -c 'import json;print(json.load(open("packages/trelix-mcp/server.json"))["packages"][0]["version"])')" \
            packages/trelix-mcp/server.json

          # Both adapters are built and published by the `publish` job below, yet nothing
          # checked their stamps: they sat at 2.4.0 while core reached 3.1.2, so with
          # `skip-existing: true` every tag published 2 of 4 packages and still went green.
          # That is the exact failure this job exists to prevent, and it had a hole for half
          # the distributions. Each adapter carries the version twice — the dist stamp that
          # PyPI sees, and the runtime `__version__` an installed package reports.
          check "trelix-langchain pyproject.toml version" \
            "$(python -c 'import tomllib;print(tomllib.load(open("packages/trelix-langchain/pyproject.toml","rb"))["project"]["version"])')" \
            packages/trelix-langchain/pyproject.toml
          check "trelix-langchain __version__" \
            "$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"",open("packages/trelix-langchain/src/trelix_langchain/__init__.py").read()).group(1))')" \
            packages/trelix-langchain/src/trelix_langchain/__init__.py
          check "trelix-llama-index pyproject.toml version" \
            "$(python -c 'import tomllib;print(tomllib.load(open("packages/trelix-llama-index/pyproject.toml","rb"))["project"]["version"])')" \
            packages/trelix-llama-index/pyproject.toml
          check "trelix-llama-index __version__" \
            "$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"",open("packages/trelix-llama-index/src/trelix_llama_index/__init__.py").read()).group(1))')" \
            packages/trelix-llama-index/src/trelix_llama_index/__init__.py

          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to release. Bump every site above to $tag, or delete and re-cut the tag."
            exit 1
          fi

      - name: CHANGELOG has a section for this version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${tag}\]" CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no '## [$tag]' section — is this release still under [Unreleased]?"; exit 1; }

  # The full CI suite has never run on a tag: ci.yml triggers on push/PR to
  # [main, develop] only, so before this the entire gate on four PyPI packages and two
  # container images was `python -m build` plus `twine check` plus a --help smoke test.
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Mirrors ci.yml's install: 'sso' is required by tests, not just by the feature —
      # test_oidc.py and test_api_audit.py import pyjwt at module scope.
      - name: Install trelix + dev deps
        run: pip install -e ".[local,otel,sso,dev]"
      - name: Install trelix-mcp
        run: pip install -e packages/trelix-mcp
      # The publish job builds and uploads both adapters, so the release path has to test
      # them. It did not: only ci.yml ever ran these suites, and ci.yml never fires on a
      # tag. Each adapter's suite is the only thing asserting its `__version__` stamp.
      - name: Install trelix-langchain + trelix-llama-index
        run: |
          pip install -e packages/trelix-langchain
          pip install -e packages/trelix-llama-index
      - name: Prefetch tree-sitter grammars
        run: python -c "from trelix.indexing.parser._grammar import prefetch_all; prefetch_all()"
      - name: Unit tests
        run: pytest tests/unit/ -q
      - name: trelix-mcp tests
        run: pytest packages/trelix-mcp/tests/ -q
      # Separate invocations, as in ci.yml: both adapter tests/ dirs have an __init__.py and
      # a test_retriever.py, so they resolve to the same module `tests.test_retriever` and a
      # single pytest collecting both aborts with "import file mismatch".
      - name: trelix-langchain tests
        run: pytest packages/trelix-langchain/tests/ -q
      - name: trelix-llama-index tests
        run: pytest packages/trelix-llama-index/tests/ -q

  build-binaries:
    name: Build trelix (${{ matrix.os }})
    needs: [verify-version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: trelix-macos-arm64
            binary-path: dist/trelix
          - os: windows-latest
            artifact-name: trelix-windows-x64
            binary-path: dist/trelix.exe
          - os: ubuntu-latest
            artifact-name: trelix-linux-x64
            binary-path: dist/trelix
          - os: ubuntu-24.04-arm
            artifact-name: trelix-linux-arm64
            binary-path: dist/trelix
          # windows-11-arm intentionally excluded: tree-sitter-languages and
          # sqlite-vec (unconditional deps) publish no win_arm64 wheel or
          # sdist, so pip install fails before the build ever runs.

    steps:
      - uses: actions/checkout@v4

      # macOS only: actions/setup-python's macOS interpreter builds sqlite3
      # without SQLITE_ENABLE_LOAD_EXTENSION, so any bundled trelix binary
      # crashes on its first real index/search call with
      # "'sqlite3.Connection' object has no attribute 'enable_load_extension'"
      # (sqlite-vec loads via conn.enable_load_extension()) — confirmed via
      # direct reproduction; a uv-provisioned python-build-standalone
      # interpreter supports it. Windows/Linux are unaffected, so only
      # macOS's provisioning step changes. See build-binaries.yml.
      - name: Set up uv (macOS — needs a Python with sqlite3 load-extension support)
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.11"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # --managed-python is required — see build-binaries.yml's comment.
          uv venv --python 3.11 --managed-python .venv-build
          source .venv-build/bin/activate
          uv pip install -e ".[local]" pyinstaller

      - name: Install dependencies (Windows/Linux)
        if: runner.os != 'macOS'
        run: pip install -e ".[local]" && pip install pyinstaller

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: |
          source .venv-build/bin/activate
          pyinstaller trelix.spec --clean --noconfirm

      - name: Build binary (Windows/Linux)
        if: runner.os != 'macOS'
        run: pyinstaller trelix.spec --clean --noconfirm

      # The binary excludes sentence-transformers/torch (trelix.spec) to stay
      # small, so --provider local can never work here — real local
      # embedding is verified separately (pytest, `pip install trelix[local]`).
      # --provider openai with a bogus key still reaches SQLiteVectorStore's
      # sqlite-vec load *before* the network call, so it still catches a
      # sqlite3 enable_load_extension regression; asserting on the literal
      # crash string (not exit code) keeps this smoke test working even
      # when the runner has no outbound network access to OpenAI.
      - name: Verify binary (macOS)
        if: runner.os == 'macOS'
        run: |
          file dist/trelix
          ./dist/trelix --help
          ./dist/trelix --version
          mkdir -p /tmp/trelix-smoke/repo
          printf 'def add(a, b):\n    """Add two numbers."""\n    return a + b\n' > /tmp/trelix-smoke/repo/util.py
          (OPENAI_API_KEY=sk-fake-key-for-ci-smoke-test ./dist/trelix index /tmp/trelix-smoke/repo --provider openai || true) 2>&1 | tee /tmp/trelix-smoke.log
          grep -q "enable_load_extension" /tmp/trelix-smoke.log && { echo "sqlite3 enable_load_extension regression detected"; exit 1; } || true
          ./dist/trelix stats /tmp/trelix-smoke/repo | grep -q "Symbols"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist/trelix.exe --help
          dist/trelix.exe --version
          mkdir -p /tmp/trelix-smoke/repo
          printf 'def add(a, b):\n    """Add two numbers."""\n    return a + b\n' > /tmp/trelix-smoke/repo/util.py
          (OPENAI_API_KEY=sk-fake-key-for-ci-smoke-test dist/trelix.exe index /tmp/trelix-smoke/repo --provider openai || true) 2>&1 | tee /tmp/trelix-smoke.log
          grep -q "enable_load_extension" /tmp/trelix-smoke.log && { echo "sqlite3 enable_load_extension regression detected"; exit 1; } || true
          dist/trelix.exe stats /tmp/trelix-smoke/repo | grep -q "Symbols"

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        run: |
          file dist/trelix
          ./dist/trelix --help
          ./dist/trelix --version
          mkdir -p /tmp/trelix-smoke/repo
          printf 'def add(a, b):\n    """Add two numbers."""\n    return a + b\n' > /tmp/trelix-smoke/repo/util.py
          (OPENAI_API_KEY=sk-fake-key-for-ci-smoke-test ./dist/trelix index /tmp/trelix-smoke/repo --provider openai || true) 2>&1 | tee /tmp/trelix-smoke.log
          grep -q "enable_load_extension" /tmp/trelix-smoke.log && { echo "sqlite3 enable_load_extension regression detected"; exit 1; } || true
          ./dist/trelix stats /tmp/trelix-smoke/repo | grep -q "Symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-path }}
          retention-days: 30

  build-distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    needs: [verify-version, test]
    permissions: {}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build trelix
        run: python -m build

      - name: Check trelix distributions
        run: twine check dist/*

      - name: Upload trelix distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-dist
          path: dist/
          retention-days: 7

      - name: Build trelix-mcp
        run: cd packages/trelix-mcp && python -m build

      - name: Check trelix-mcp distributions
        run: twine check packages/trelix-mcp/dist/*

      - name: Upload trelix-mcp distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-mcp-dist
          path: packages/trelix-mcp/dist/
          retention-days: 7

      - name: Build trelix-langchain
        run: cd packages/trelix-langchain && python -m build

      - name: Check trelix-langchain distributions
        run: twine check packages/trelix-langchain/dist/*

      - name: Upload trelix-langchain distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-langchain-dist
          path: packages/trelix-langchain/dist/
          retention-days: 7

      - name: Build trelix-llama-index
        run: cd packages/trelix-llama-index && python -m build

      - name: Check trelix-llama-index distributions
        run: twine check packages/trelix-llama-index/dist/*

      - name: Upload trelix-llama-index distributions
        uses: actions/upload-artifact@v4
        with:
          name: trelix-llama-index-dist
          path: packages/trelix-llama-index/dist/
          retention-days: 7

  publish:
    name: Publish to PyPI & GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-distributions]
    environment: pypi
    permissions:
      id-token: write    # OIDC trusted publisher (PyPI) — scoped to publish job only
      contents: write    # create GitHub Release + upload assets

    steps:
      - name: Download trelix distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-dist
          path: dist/

      - name: Download trelix-mcp distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-mcp-dist
          path: packages/trelix-mcp/dist/

      - name: Download trelix-langchain distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-langchain-dist
          path: packages/trelix-langchain/dist/

      - name: Download trelix-llama-index distributions
        uses: actions/download-artifact@v4
        with:
          name: trelix-llama-index-dist
          path: packages/trelix-llama-index/dist/

      - name: Publish trelix to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
          attestations: true

      - name: Publish trelix-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: packages/trelix-mcp/dist/
          skip-existing: true
          attestations: true

      - name: Publish trelix-langchain to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: packages/trelix-langchain/dist/
          skip-existing: true
          attestations: true

      - name: Publish trelix-llama-index to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: packages/trelix-llama-index/dist/
          skip-existing: true
          attestations: true

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-macos-arm64
          path: release-assets/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-windows-x64
          path: release-assets/windows

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-linux-x64
          path: release-assets/linux

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: trelix-linux-arm64
          path: release-assets/linux-arm64

      - name: Rename binaries to unique release asset names
        # softprops/action-gh-release uploads by basename — macOS's and Linux's
        # binaries are both called "trelix", so without renaming they collide
        # into a single asset and one platform's binary silently disappears.
        run: |
          mv release-assets/macos/trelix release-assets/macos/trelix-macos-arm64
          mv release-assets/windows/trelix.exe release-assets/windows/trelix-windows-x64.exe
          mv release-assets/linux/trelix release-assets/linux/trelix-linux-x64
          mv release-assets/linux-arm64/trelix release-assets/linux-arm64/trelix-linux-arm64

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/trelix-macos-arm64
            release-assets/windows/trelix-windows-x64.exe
            release-assets/linux/trelix-linux-x64
            release-assets/linux-arm64/trelix-linux-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
