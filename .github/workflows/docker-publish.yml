# KNOWN GAP (not fixed here): this workflow is NOT gated on release.yml's `test` job.
#
# Both workflows start concurrently on a `v*` tag push. The only guard below is "tag equals
# pyproject version". If release.yml's test, smoke-test or binary build fails, PyPI and the
# GitHub Release stay unpublished but ghcr.io/sairam0424/trelix:X.Y.Z, :X.Y.Z-local and
# :latest / :latest-local are already pushed. Nothing rolls the images back.
#
# Why it has not been closed yet: no option below can be proven without a real release, and a
# mistake here breaks publishing, not just a check. Options and trade-offs:
#
#   A. Fold these jobs into release.yml with `needs: [verify-version, test]`.
#      + Uses only documented `needs` semantics; the strongest gate.
#      - The "Docker Publish" workflow run disappears for tags. verify-release.yml listens
#        for workflow_run of BOTH "Release" and "Docker Publish" and looks up the sibling's
#        run for the tag; scripts/verify_release.py and its tests name both. All would need
#        to change together. release.yml would also need `packages: write` on a job, and the
#        workflow_dispatch backfill (with move_latest) would still need a home, so this file
#        would survive anyway for dispatch, leaving two copies of the build steps.
#
#   B. Trigger on `workflow_run` of "Release" (types: completed, conclusion == success).
#      + Small diff; images only ever follow a green test run.
#      - workflow_run runs the file from the default branch and checks out the default
#        branch head, so every step would need an explicit `ref: refs/tags/...` checkout.
#      - github.event_name becomes workflow_run, which breaks the `== 'push'` conditions
#        (tag/tree check, :latest movement). Images would publish only AFTER PyPI, and a
#        failed Release would block a docker-only backfill of the same tag.
#
#   C. Add a first job that waits for the Release run of the same tag (gh run watch).
#      - Needs `actions: read`, polling and a timeout; brittle, and it burns runner minutes.
#
#   D. Repository settings instead of workflow edits: a tag ruleset restricting `v*` to
#      commits on main (whose CI already passed), and required reviewers on an
#      environment attached to this job. Not visible in, or testable from, this repo.
#
# Recommendation: A, done as its own reviewed change together with verify-release.yml and
# scripts/verify_release.py, and rehearsed once on a throwaway tag in a fork. D can be done
# today. Until then, recover a bad image by deleting its GHCR tags and re-running.

name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 2.9.0) — for backfilling a release whose Docker publish failed without re-tagging"
        required: true
      move_latest:
        description: "Also move the :latest / :latest-local tags to this version — only set true when backfilling the CURRENT release, never an older one"
        type: boolean
        default: false

jobs:
  publish:
    name: Build and push (extras=${{ matrix.extras }})
    runs-on: ubuntu-latest
    # Multi-arch build under QEMU; the -local variant bundles torch. Generous on purpose: a
    # timeout that kills a slow legitimate build is worse than a hang, and it is recoverable
    # via the workflow_dispatch backfill.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing variant must not cancel the other mid-push, which can leave a partly
      # written image. This does not make the release atomic: the surviving variant still
      # publishes, and the failed one is redone through the workflow_dispatch backfill.
      fail-fast: false
      matrix:
        include:
          # Slim: API-embedder-only (OpenAI/Voyage/Cohere/Azure). Small image,
          # the default recommendation for anyone not running local/offline embeddings.
          - extras: serve
            tag-suffix: ""
          # Bundles sentence-transformers/torch for the local/offline embedder
          # and cross-encoder reranker — multi-GB, opt-in via the -local tag.
          - extras: "serve,local"
            tag-suffix: "-local"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        # Passed through env rather than interpolated into the script body. A
        # workflow_dispatch input reaching `run:` via ${{ }} is a shell-injection sink —
        # it needs write access to reach, so the risk is bounded, but the env form costs
        # nothing and is the pattern the rest of this repo should follow.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Same hole release.yml had: the image tag came from the git ref with nothing
      # comparing it to the tree, so a v3.2.0 tag on a 3.1.2 tree published
      # ghcr.io/.../trelix:3.2.0 containing a binary that reports 3.1.2 — and the run
      # went green.
      #
      # Tag pushes only. The workflow_dispatch path exists to backfill a release whose
      # Docker publish failed without re-tagging, so there the tree legitimately does not
      # match the version being published.
      - name: Verify the tag matches the tree
        if: github.event_name == 'push'
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error file=pyproject.toml::tag says '$EXPECTED' but the tree is stamped '$actual' — refusing to publish a mislabelled image"
            exit 1
          fi
          echo "ok: tree and tag agree on $actual"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: EXTRAS=${{ matrix.extras }}
          push: true
          # :latest moves on a real tag push, or on a workflow_dispatch
          # backfill that explicitly opts in via move_latest — e.g.
          # backfilling THIS release's failed variant. Never moves on a
          # plain backfill dispatch (move_latest unset/false), so re-running
          # publish for an older release can't repoint :latest backwards.
          tags: |
            ghcr.io/sairam0424/trelix:${{ steps.version.outputs.version }}${{ matrix.tag-suffix }}
            ${{ (github.event_name == 'push' || github.event.inputs.move_latest == 'true') && format('ghcr.io/sairam0424/trelix:latest{0}', matrix.tag-suffix) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
