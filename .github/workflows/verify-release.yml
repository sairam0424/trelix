name: Verify Release

# WHY `workflow_run`, and why it is safe here (zizmor: dangerous-triggers, ACCEPTED).
#
# zizmor reports every `workflow_run` trigger because such a workflow runs with the base
# repository's token and secrets even when the run that triggered it came from a fork, so a
# careless one can be made to run attacker-controlled code. This is the chosen design, not the
# only one: the artifacts it checks (PyPI packages, GHCR images, release binaries) are published
# by two independent tag-triggered workflows, "Release" and "Docker Publish", and listening for
# their completion verifies the result after BOTH have finished without restructuring either
# pipeline. Folding Docker Publish into release.yml with `needs:` (option A in docker-publish.yml's
# header) would change how verification is triggered; that is a separate reviewed change.
# What makes the chosen design defensible:
#
# * A `workflow_run` event gets past the job's `if:` only for a `push` run of THIS repository
#   (base and head) that succeeded and whose `head_branch` starts with `v`; for the push runs
#   of these two workflows that is the tag. A pull-request run of either workflow, a branch push,
#   a hand-started (`workflow_dispatch`) run, or one from a fork, never gets past it. The
#   workflow's own `workflow_dispatch` is the one other way in: maintainers only (it needs
#   write access), and it checks out the ref it was started on.
# * The token is read-only (`contents: read`, `actions: read`).
# * The checkout takes no `ref:` and no `repository:`, so on a `workflow_run` it is the default
#   branch head and never the triggering run's head commit; the script that runs is the
#   reviewed default copy.
# * Event, input and step-output data reach a `run:` script only through `env:` (`HEAD_SHA`
#   below), never `${{ }}`.
#
# The ignore comment on `workflow_run:` carries this reason on one line because
# tests/unit/test_release_workflow_zizmor_fixes.py reads it there. It silences the whole `on:`
# block, so tests/unit/test_verify_release_workflow_guards.py pins the trigger set and the job set.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] accepted: verifies after both publish workflows finish; for workflow_run runs only this repo's successful push runs whose head_branch starts with v, default-branch checkout; workflow_dispatch is maintainer-only; read-only token; event data only via env
    workflows: ["Release", "Docker Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify, e.g. 3.2.3 (no leading v)"
        required: true

# No workflow-level scopes: the one job below declares exactly what it uses.
permissions: {}

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Checked against what the job really does, not inherited from an older block:
    # `packages: read` was dropped because nothing here authenticates to GHCR (no docker
    # login step and none in scripts/verify_release.py), so the image pulls are anonymous
    # whatever the token's scopes are.
    permissions:
      contents: read  # checkout and `gh release download` (verify_release.py's tag `git fetch` is anonymous)
      actions: read  # `gh run list --workflow ... --branch <tag>` in the sibling-run check
    # A `workflow_run` event is only trusted when ALL of these hold, so a fork's run, a
    # pull-request run or a branch push can never reach the steps below. For a push run,
    # `head_branch` is the tag name when a tag started it, and both watched workflows are
    # triggered by `v*` tag pushes (Docker Publish's one other trigger, a hand-started run,
    # fails the `== 'push'` clause). This workflow's own `workflow_dispatch` is the manual
    # re-verification path.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    steps:
      # No `ref:` and no `repository:` on purpose: on a workflow_run event this checks out the
      # default branch head, never the head of the run that triggered us (which could be a
      # fork's). verify_release.py below is therefore the reviewed default-branch copy.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Passed through env rather than interpolated into the script body, matching
      # docker-publish.yml's own documented convention: a workflow_dispatch input (or
      # a workflow_run event field) reaching `run:` via ${{ }} is a shell-injection
      # sink -- the env form costs nothing and keeps this consistent with the rest of
      # this repo.
      - name: Resolve version and tag to verify
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            tag="$(git tag --points-at "$HEAD_SHA" | grep '^v' | head -1 || true)"
            if [ -z "$tag" ]; then
              echo "no v* tag found at $HEAD_SHA; nothing to verify"
              echo "version=" >> "$GITHUB_OUTPUT"
            else
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            fi
          fi

      # This workflow_run trigger fires once per named workflow's completion, but
      # both must be green before verify_release.py can succeed (Docker checks need
      # docker-publish.yml done, PyPI checks need release.yml done). Rather than
      # restructure the two independent, already-working pipelines, check the
      # SIBLING workflow's own latest run for this same tag here — the run that
      # finishes SECOND is the one that actually proceeds past this step.
      - name: Wait for the sibling release workflow to also be green
        id: sibling
        if: steps.resolve.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RESOLVED_VERSION}"
          for wf in "Release" "Docker Publish"; do
            conclusion="$(gh run list --workflow "$wf" --branch "$tag" --limit 1 --json conclusion -q '.[0].conclusion')"
            echo "$wf: $conclusion"
            if [ "$conclusion" != "success" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "$wf has not succeeded yet for $tag — skipping this run; the other workflow's completion will re-trigger this check."
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.sibling.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install pip-audit + verify_release.py's own runtime needs
        if: steps.sibling.outputs.ready == 'true'
        run: python -m pip install --quiet pip-audit

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        if: steps.sibling.outputs.ready == 'true'

      - name: Run scripts/verify_release.py
        if: steps.sibling.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
        run: python scripts/verify_release.py --version "$RESOLVED_VERSION"
