name: GitHub App CI

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/github-app/**"
      - ".github/workflows/github-app-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/github-app/**"
      - ".github/workflows/github-app-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Print the Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build context is the repo root (the Dockerfile's Python stage
      # needs src/ for the trelix CLI) — this is also the only thing that
      # actually proves the root .dockerignore's `!infra/github-app/`
      # negation (see .dockerignore's own comment) keeps working as the
      # repo evolves, not just at the time it was added.
      - name: Build image
        run: docker build -f infra/github-app/Dockerfile -t trelix-github-app:ci .

      # The runtime stage gets `node` by COPY from node:24-bookworm-slim into a
      # python:3.14-slim (Debian trixie) stage, so a glibc or libstdc++ mismatch
      # would show up when the binary is started, not when the image is built.
      # Start it as the image's own user and fail unless it reports Node 24.
      - name: Verify the image runs Node 24
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint node trelix-github-app:ci --version)"
          echo "image node: ${version}"
          case "${version}" in
            v24.*) ;;
            *) echo "expected Node 24 in the image, got ${version}" >&2; exit 1 ;;
          esac

      # Informational: the SQLite the image's Python links. The App shells out to
      # `trelix index` / `trelix review` inside this image, so this is the SQLite those
      # children write their index with. Fed on stdin because the image carries no scripts/.
      # The script exits 0 on every path; no `continue-on-error`, no `|| true`.
      - name: Report the SQLite version linked inside the image
        run: docker run --rm -i --entrypoint python trelix-github-app:ci - < scripts/report_sqlite_version.py
