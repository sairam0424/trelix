name: GitHub App CI

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/github-app/**"
      - ".github/workflows/github-app-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/github-app/**"
      - ".github/workflows/github-app-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
