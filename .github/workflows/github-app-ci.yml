name: GitHub App CI

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/github-app/**"
      - ".github/workflows/github-app-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/github-app/**"
      - ".github/workflows/github-app-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build context is the repo root (the Dockerfile's Python stage
      # needs src/ for the trelix CLI) — this is also the only thing that
      # actually proves the root .dockerignore's `!infra/github-app/`
      # negation (see .dockerignore's own comment) keeps working as the
      # repo evolves, not just at the time it was added.
      - name: Build image
        run: docker build -f infra/github-app/Dockerfile -t trelix-github-app:ci .
