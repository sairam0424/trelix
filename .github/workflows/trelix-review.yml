name: trelix PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trelix-review:
    name: trelix Code Intelligence Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      contents: read

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install trelix
        run: pip install "trelix[local]" --quiet

      # Every step below runs with its cwd inside the PR head — i.e. inside
      # content the PR author controls. A `.env` committed by that author used to
      # be a live configuration source for all of trelix's settings models
      # (cwd-relative `env_file`), which let it repoint providers/endpoints and
      # name the model whose Python a trusted-remote-code load executes here.
      # src/trelix/core/config.py now anchors the dotenv source to an
      # operator-owned path, and this step is the belt-and-braces half so the CI
      # leg is safe even against a trelix build that predates that fix.
      #
      # Scope, stated precisely rather than inflated: the trigger is
      # `pull_request`, not `pull_request_target`, so a FORK PR runs with a
      # read-only token and no repository secrets. A same-repo BRANCH PR is the
      # one that matters — it gets the `pull-requests: write` and `checks: write`
      # declared above.
      - name: Remove untrusted dotenv from the PR checkout
        run: rm -f .env

      - name: Index repository
        # No `continue-on-error` here: this step executes repository content, and
        # `continue-on-error: true` reported success no matter what happened
        # inside it — an exploit, or a crash, looked identical to a clean run.
        # Indexing genuinely can fail in restricted CI (model download, OOM), so
        # the failure is tolerated but SURFACED as a run annotation.
        run: |
          if ! trelix index .; then
            echo "::warning title=trelix index failed::review findings are from a partial or empty index"
          fi

      - name: Run trelix review
        id: review
        run: |
          # Only stdout is redirected — trelix review --json writes status/
          # progress messages to stderr and ONLY the JSON array to stdout
          # (see src/trelix/cli/main.py), so merging stderr in here would
          # corrupt the file again.
          trelix review --pr "${TRELIX_REPO}#${TRELIX_PR_NUMBER}" --json > /tmp/trelix-review.json 2>/tmp/trelix-review.stderr.log || true
          cat /tmp/trelix-review.stderr.log
          echo "review_file=/tmp/trelix-review.json" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELIX_PR_NUMBER: ${{ github.event.pull_request.number }}
          TRELIX_REPO: ${{ github.repository }}

      - name: Post review as Check annotations
        uses: actions/github-script@v7
        env:
          TRELIX_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // Use a fixed, trusted path — never interpolate step outputs into JS source
            const reviewFile = '/tmp/trelix-review.json';
            // PR number comes from env, not directly from context expression in source
            const prNumber = parseInt(process.env.TRELIX_PR_NUMBER, 10);

            // trelix review --json emits a bare array of
            // {file, lines: "start-end", severity: "ERROR"|"WARN"|"INFO", comment}
            // — see src/trelix/cli/main.py's review() --pr --json path.
            let findings = [];
            try {
              const raw = fs.readFileSync(reviewFile, 'utf8');
              findings = JSON.parse(raw);
            } catch (e) {
              console.log('No structured review output:', e.message);
            }

            const annotations = findings.slice(0, 50).map(f => {
              const [startLine, endLine] = String(f.lines || '1-1').split('-').map(Number);
              return {
                path: f.file || 'unknown',
                start_line: startLine || 1,
                end_line: endLine || startLine || 1,
                annotation_level: f.severity === 'ERROR' ? 'failure'
                  : f.severity === 'WARN' ? 'warning' : 'notice',
                message: f.comment || String(f),
                title: 'trelix review',
              };
            });

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'trelix Code Review',
              head_sha: context.sha,
              status: 'completed',
              conclusion: annotations.some(a => a.annotation_level === 'failure')
                ? 'failure' : 'success',
              output: {
                title: `trelix found ${annotations.length} issue(s)`,
                summary: `trelix reviewed PR #${prNumber} and found ${annotations.length} issue(s).`,
                annotations,
              },
            });
