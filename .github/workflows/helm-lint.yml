name: Helm Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: helm lint + template (backend=${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [sqlite, qdrant, lance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "v3.16.2"

      - name: Helm lint
        run: helm lint helm/trelix

      - name: Helm template (backend=${{ matrix.backend }})
        run: |
          helm template test helm/trelix \
            --set store.backend=${{ matrix.backend }} \
            --set store.qdrant.apiKey=ci-test-placeholder

      - name: Assert rendered image tag matches appVersion
        run: |
          RENDERED=$(helm template test helm/trelix --set store.backend=${{ matrix.backend }} --set store.qdrant.apiKey=ci-test-placeholder | grep -m1 'image:.*trelix' | awk '{print $2}' | tr -d '"')
          APP_VERSION=$(grep '^appVersion:' helm/trelix/Chart.yaml | sed 's/appVersion: *"\?\([^"]*\)"\?/\1/')
          echo "rendered=$RENDERED appVersion=$APP_VERSION"
          [[ "$RENDERED" == *":$APP_VERSION" ]] || { echo "::error::rendered image tag ($RENDERED) does not match Chart.yaml appVersion ($APP_VERSION)"; exit 1; }

      - name: Helm template (ingress enabled)
        if: matrix.backend == 'sqlite'
        run: helm template test helm/trelix --set ingress.enabled=true

      # trelix-mcp is optional and off by default: render it on (a chart-Secret token, then the
      # existing-Secret path the README documents), render it off and check nothing of it is
      # left, and check the two refusals, which `helm lint` does not exit non-zero on.
      - name: Helm template (trelix-mcp enabled, backend=${{ matrix.backend }})
        run: |
          OUT=$(helm template test helm/trelix \
            --set store.backend=${{ matrix.backend }} \
            --set store.qdrant.apiKey=ci-test-placeholder \
            --set mcp.enabled=true \
            --set mcp.auth.token=ci-test-placeholder)
          grep -qF 'value: "test-trelix,test-trelix.default,test-trelix.default.svc"' <<< "$OUT"
          grep -qF 'args: ["--transport", "http", "--host", "0.0.0.0", "--port", "8766", "--root", "/data"]' <<< "$OUT"
          grep -qF 'targetPort: mcp' <<< "$OUT"
          OUT=$(helm template test helm/trelix \
            --set store.backend=${{ matrix.backend }} \
            --set store.qdrant.apiKey=ci-test-placeholder \
            --set mcp.enabled=true \
            --set mcp.auth.existingSecretName=ci-secret)
          grep -qF 'name: ci-secret' <<< "$OUT"

      - name: Helm template (mcp off renders no trelix-mcp, backend=${{ matrix.backend }})
        run: |
          OUT=$(helm template test helm/trelix \
            --set store.backend=${{ matrix.backend }} \
            --set store.qdrant.apiKey=ci-test-placeholder \
            --set mcp.auth.token=ci-test-placeholder)
          if grep -qiF mcp <<< "$OUT"; then
            echo "::error::mcp.enabled is false but the render mentions mcp"; exit 1
          fi

      # The opt-in hardening is off by default, so the renders above never reach it: render each
      # knob on, with trelix-mcp off (nothing of it may leak into the output) and then on, and
      # check the NetworkPolicy refusal, which `helm lint` does not exit non-zero on.
      - name: Helm template (hardening opt-ins)
        if: matrix.backend == 'sqlite'
        run: |
          OPTIN=(--set securityContext.readOnlyRootFilesystem=true
                 --set securityContext.runAsNonRoot=true --set securityContext.runAsUser=999
                 --set securityContext.runAsGroup=999 --set networkPolicy.enabled=true)
          OUT=$(helm template test helm/trelix "${OPTIN[@]}")
          grep -qF 'readOnlyRootFilesystem: true' <<< "$OUT"
          grep -qF 'mountPath: /tmp' <<< "$OUT"
          grep -qF 'kind: NetworkPolicy' <<< "$OUT"
          if grep -qiF mcp <<< "$OUT"; then
            echo "::error::mcp.enabled is false but the render mentions mcp"; exit 1
          fi
          OUT=$(helm template test helm/trelix "${OPTIN[@]}" --set mcp.enabled=true --set mcp.auth.token=ci-test-placeholder)
          [[ $(grep -cF 'mountPath: /tmp' <<< "$OUT") == 2 ]]
          grep -qF -- '- port: 8766' <<< "$OUT"
          if ERR=$(helm template test helm/trelix --set networkPolicy.enabled=true --set ingress.enabled=true 2>&1); then
            echo "::error::networkPolicy.enabled rendered with an Ingress and no ingressFrom"; exit 1
          fi
          grep -qF 'needs networkPolicy.ingressFrom' <<< "$ERR"

      - name: Helm template refuses mcp.enabled without a token or a volume
        if: matrix.backend == 'sqlite'
        run: |
          if ERR=$(helm template test helm/trelix --set mcp.enabled=true 2>&1); then
            echo "::error::mcp.enabled rendered without a token"; exit 1
          fi
          grep -qF 'mcp.enabled needs mcp.auth.token or mcp.auth.existingSecretName' <<< "$ERR"
          if ERR=$(helm template test helm/trelix --set mcp.enabled=true --set mcp.auth.token=ci-test-placeholder --set persistence.enabled=false 2>&1); then
            echo "::error::mcp.enabled rendered without persistence"; exit 1
          fi
          grep -qF 'mcp.enabled needs persistence.enabled' <<< "$ERR"

  # ---------------------------------------------------------------------------
  # The `lint` job above only checks chart CORRECTNESS (does it lint, does it render,
  # does the image tag match appVersion) — it says nothing about the security posture of
  # what actually ships in those manifests, e.g. missing resource limits/securityContext.
  # Report-only: this is a brand-new check with an unmeasured baseline, so — following
  # the same reasoning security-scan.yml's header documents for its own unmeasured
  # `image` job — it does not block on day one.
  # ---------------------------------------------------------------------------
  security:
    name: IaC scan (checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        env:
          # CKV_K8S_21 (default namespace): the chart sets no metadata.namespace on purpose, so that
          # `helm install -n <ns>` decides it. Checkov's check passes when HELM_NAMESPACE names a
          # namespace other than "default" (checkov 3.3.20, the image this action runs). Not set
          # on the `lint` job: its allow-list test expects `.default` in the render.
          HELM_NAMESPACE: trelix
        with:
          directory: helm/trelix
          framework: helm
          # Skipped on purpose, one reason per rule. Everything else Checkov reports on this
          # chart is fixed in the chart, not skipped. skip_check is a comma-separated scalar,
          # which cannot carry per-rule comments, hence the reasons up here.
          #   CKV_K8S_11 (CPU limits): no default limit; a CPU limit throttles the bursty parse
          #     and embed phases. Set resources.limits.cpu to get one.
          #   CKV_K8S_13 (memory limits): no default limit; one that is too low OOM-kills the
          #     pod while it indexes a large repository. Set resources.limits.memory once you
          #     have measured your largest repository.
          #   CKV_K8S_15 (pull policy Always): IfNotPresent, because the image is a versioned
          #     tag; operators who need immutability pin a digest. Set image.tag to
          #     X.Y.Z@sha256:<digest> to pin one.
          #   CKV_K8S_22 (read-only root filesystem): opt-in, off by default, because a bare
          #     read-only root breaks indexing while the probes stay green. Set
          #     securityContext.readOnlyRootFilesystem=true; the chart then mounts the writable
          #     /tmp and /cache it needs.
          #   CKV_K8S_23 (root containers): opt-in, off by default. runAsNonRoot needs a numeric
          #     user because the image's USER is a name. Set securityContext.runAsNonRoot=true,
          #     runAsUser=999 and runAsGroup=999 (the published images' ids).
          #   CKV_K8S_40 (UID of 10000 or more): the image runs as UID 999, and another UID
          #     means migrating the ownership of existing data. Set securityContext.runAsUser
          #     to 10000 or more, in an image built with a user of that UID.
          #   CKV_K8S_43 (image digest): a digest cannot be committed to values.yaml, since
          #     docker-publish.yml builds the image after the tag push that release.yml
          #     verify-version checks. Set image.tag to X.Y.Z@sha256:<digest> to pin one.
          #   CKV2_K8S_6 (NetworkPolicy): opt-in, off by default, because a default-on policy
          #     cuts off an Ingress controller and cross-namespace clients. Set
          #     networkPolicy.enabled=true (and networkPolicy.ingressFrom for them).
          skip_check: CKV_K8S_11,CKV_K8S_13,CKV_K8S_15,CKV_K8S_22,CKV_K8S_23,CKV_K8S_40,CKV_K8S_43,CKV2_K8S_6
          output_format: sarif
          output_file_path: results.sarif,
          soft_fail: true

      - if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: checkov-helm
