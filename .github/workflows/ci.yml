name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # 'sso' installs pyjwt[crypto], so mypy type-checks src/trelix/auth/
      # against real PyJWT types instead of silently treating jwt as Any.
      - name: Install project + dev deps
        run: pip install -e ".[local,sso,dev]"
      - name: Install trelix-mcp, trelix-langchain, trelix-llama-index
        run: |
          pip install -e packages/trelix-mcp
          pip install -e packages/trelix-langchain
          pip install -e packages/trelix-llama-index
      # scripts/ and packages/*/tests were outside the lint scope entirely, and both
      # hold code the project relies on: scripts/measure_index_hygiene.py is what
      # produced the 915-files/59.3%-noise -> 454-files/0%-noise figures published in
      # docs/README.md, and packages/*/tests are the only tests the three adapter
      # packages have. Both are already clean under `ruff check` (verified: 0
      # findings), so widening to them costs nothing and closes the hole.
      - name: Ruff check
        run: ruff check src/ tests/ scripts/ packages/trelix-mcp/src packages/trelix-langchain/src packages/trelix-llama-index/src packages/trelix-mcp/tests packages/trelix-langchain/tests packages/trelix-llama-index/tests
      # packages/*/tests is added here too (all 8 files already pass `ruff format
      # --check`). scripts/ is deliberately NOT in the format scope: it is the one
      # widening that does not pass today — `ruff format --check scripts/` reports
      # "Would reformat: scripts/measure_index_hygiene.py". Adding it here would put
      # CI red on a file this job cannot fix, so the format widening is staged behind
      # reformatting that file; do both in the same commit.
      - name: Ruff format check
        run: |
          ruff format src/ tests/ packages/trelix-mcp/src packages/trelix-langchain/src packages/trelix-llama-index/src packages/trelix-mcp/tests packages/trelix-langchain/tests packages/trelix-llama-index/tests
          git diff --exit-code -- src/ tests/ packages/trelix-mcp/src packages/trelix-langchain/src packages/trelix-llama-index/src packages/trelix-mcp/tests packages/trelix-langchain/tests packages/trelix-llama-index/tests || (echo "ruff format changed files — commit the formatted output" && exit 1)
      # This job installs only [local,sso,dev], so voyageai, google-genai and watchdog
      # are absent and every expression touching them degrades to Any. That is what
      # makes this run report zero errors while six real ones exist — NOT the
      # `--ignore-missing-imports` flags below, which are a no-op here because
      # pyproject's [tool.mypy] already sets ignore_missing_imports = true globally.
      # The six are gated and enforced in the `type-check-extras` job; this run stays
      # the zero-tolerance gate for the extras-free surface.
      #
      # packages/*/tests is not type-checked: under [tool.mypy] strict = true those
      # three dirs report 79 errors, essentially all no-untyped-def/no-untyped-call on
      # unannotated test functions. Gating that needs ~79 annotations across test files
      # and would be pure churn behind this job, so it is an explicit exclusion rather
      # than an oversight. scripts/ IS checked, in type-check-extras.
      - name: Mypy
        run: |
          mypy src/trelix/ --ignore-missing-imports
          mypy packages/trelix-mcp/src/ --ignore-missing-imports
          mypy packages/trelix-langchain/src/ --ignore-missing-imports
          mypy packages/trelix-llama-index/src/ --ignore-missing-imports

  type-check-extras:
    name: Type Check (optional extras present)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # voyage/vertex/watch are the whole point of this job: with voyageai,
      # google-genai and watchdog installed, mypy resolves real types instead of Any
      # and six errors in src/trelix/ become visible that the `lint` job cannot see.
      # `local` is required as well, not for coverage but for correctness of the
      # baseline: it is what pulls `requests` in transitively, and without it the
      # `# type: ignore` comments in retrieval/reranker.py:190-191 flip to
      # unused-ignore errors and the baseline below stops matching.
      - name: Install project + optional extras
        run: pip install -e ".[local,sso,voyage,vertex,watch,dev]"
      # Measured against this tree: mypy reports 7 errors in 4 files here —
      # embedder/base.py:303 (voyageai does not export Client) and :310 (x3, **kwargs
      # widened to dict[str, object] against embed()'s typed params),
      # vertex_backend.py:185 (list[Tool] passed where list[Tool | Callable | ...] is
      # expected; list is invariant), watcher.py:110 (_TrelixEventHandler is not a
      # FileSystemEventHandler subclass), and scripts/measure_index_hygiene.py:184
      # (argparse `--provider` has no choices=, so an arbitrary str is assigned to the
      # embedder-provider Literal; EmbedderConfig does not set validate_assignment, so
      # `--provider typo` sticks silently and mypy is the only thing that sees it).
      #
      # None of those can be fixed from this file, and a `continue-on-error: true`
      # job would surface them into a log nobody opens — the same failure mode as the
      # gates this workflow has been closing. So this is a ceiling, not a mirror: the
      # known debt is recorded below and a type error in any file/code pair that is
      # NOT recorded fails the job. It is green on this tree and it catches the
      # regression that matters (new type errors in modules that are clean today).
      #
      # Deliberately keyed on (file, error-code), not file:line — line numbers move
      # whenever anything above them is edited, and a gate that goes red on unrelated
      # diffs gets deleted. The cost of that choice: a second error of an
      # already-recorded code in an already-recorded file slips through.
      #
      # When one of these is fixed, delete its line here — the job prints a ::notice::
      # naming the stale entries, it does not fail on them.
      - name: Mypy with optional extras (known-debt ceiling)
        run: |
          mypy src/trelix/ scripts/ --ignore-missing-imports > mypy-extras.log 2>&1 || true
          cat mypy-extras.log
          # A crash (exit 2, traceback, no summary line) yields zero parsed errors,
          # which would otherwise sail through the comparison below as "no new errors".
          grep -qE '^(Found [0-9]+ error|Success: no issues found)' mypy-extras.log \
            || { echo "::error::mypy did not run to completion — see log above"; exit 1; }
          grep -E '^[^ ]+\.py:[0-9]+: error: ' mypy-extras.log \
            | sed -E 's/^([^:]+):[0-9]+: error: .*\[([a-z-]+)\]$/\1 [\2]/' \
            | LC_ALL=C sort -u > mypy-extras.observed
          printf '%s\n' \
            'scripts/measure_index_hygiene.py [assignment]' \
            'src/trelix/embedder/base.py [arg-type]' \
            'src/trelix/embedder/base.py [attr-defined]' \
            'src/trelix/indexing/watcher.py [arg-type]' \
            'src/trelix/llm/providers/vertex_backend.py [arg-type]' \
            | LC_ALL=C sort -u > mypy-extras.baseline
          new=$(comm -13 mypy-extras.baseline mypy-extras.observed)
          stale=$(comm -23 mypy-extras.baseline mypy-extras.observed)
          if [ -n "$new" ]; then
            echo "::error::mypy reported type errors outside the recorded baseline:"
            echo "$new"
            echo "Fix them, or — if intentional — add the (file, code) pair to the baseline in .github/workflows/ci.yml with a reason."
            exit 1
          fi
          if [ -n "$stale" ]; then
            echo "::notice::baseline entries no longer reported; remove them from .github/workflows/ci.yml:"
            echo "$stale"
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is here because Dockerfile's base image moves to python:3.14-slim (#165).
        # Without this leg the shipped container would run a Python the suite has never
        # been exercised against: the Docker smoke test only builds the image and runs
        # `--help`, which cannot detect a behavioural difference in the stdlib or a
        # dependency. Verified before adding, on 3.14.6 with every extra installed:
        # 3256 collected (identical to 3.11), 3256 passed, 0 skipped, 0 failed, plus
        # 102/19/10 in the three packages.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Hub offline for the unit matrix ONLY. 48.3% of this suite's wall clock (238.75s of
    # 494.70s) was live HTTP to huggingface.co, and with the socket ban in addopts these
    # two variables are what let 51 tests load the CACHED model instead of revalidating
    # against the Hub. Measured locally: same three files go 41 failed -> 188 passed.
    # Deliberately NOT on the `integration` job, which documents that it may download.
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      # fetch-tags is load-bearing, not hygiene: tests/unit/test_assembler_backcompat_golden.py
      # builds its baseline from `git show v2.12.0:src/trelix/retrieval/assembler.py` to prove
      # the compression-disabled assembler is byte-identical to the last pre-compression
      # release. actions/checkout does a shallow, tag-less fetch by default, so without this
      # the tag is missing, the suite skips at module level, and 177 assertions go dark
      # silently. fetch-depth: 0 fetches full history including tags; fetch-tags keeps the
      # tag requirement explicit so a future depth reduction does not re-break the suite.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # 'sso' is required by tests, not just by the feature: tests/unit/test_oidc.py
      # and tests/unit/test_api_audit.py import pyjwt/cryptography at module
      # scope, so without this extra the whole unit run fails at collection.
      #
      # 'bge-code' is here for the same class of reason, and it is load-bearing.
      # tests/unit/test_embedder_bge.py::TestBGECodePooling uses the REAL pooling
      # functions out of FlagEmbedding, and pytest.importorskip turns their absence
      # into a SKIP -- a green that reads identically to a passing run. Measured on
      # this tree with FlagEmbedding blocked at sys.meta_path: "10 passed, 2
      # skipped". So without this extra the two strict-xfail pooling tests never
      # execute in CI, and the XPASS(strict) that is meant to fire the moment the
      # provider stops pooling with 'cls' never fires -- the exact shape of failure
      # that let the bge-code defect survive four releases behind a green MagicMock.
      # Nothing is downloaded: the tests build a randomly initialised 2-layer
      # Qwen2Model from a checked-in copy of the published config.json, and pass
      # under HF_HUB_OFFLINE=1. Cost, measured rather than assumed: beyond torch,
      # transformers and sentence_transformers (all already installed by [local]),
      # FlagEmbedding adds datasets, accelerate, peft, ir-datasets, sentencepiece,
      # protobuf and 17 more (24 packages by the resolver's count). NOT pure-python:
      # datasets requires pyarrow>=21.0.0, which is 118.6 MB on disk with 37 compiled
      # extension modules. What was actually measured is wall clock on this workflow --
      # the four test legs went 5m23s -> 5m30s mean, +7s, inside noise -- so that is the
      # number quoted. No CUDA. This does not contradict pyproject.toml:219-220, which keeps bge-code
      # out of the `all` aggregate because that fine-tuning stack is not a RUNTIME
      # inference dependency; a test job installing a test-only extra is a
      # different question, and `all` is unchanged.
      # `nomic-code` is here for one reason: it is the only thing that proves its own
      # declaration resolves. v3.2.0 added `einops>=0.7.0` to that extra after finding the
      # provider had never constructed for any user — CodeRankEmbed's published
      # modeling_hf_nomic_bert.py imports einops at module top level, and no extra declared
      # it. Nothing in CI installed the extra, so the fix shipped with no job that would go
      # red if the dependency were unresolvable or the declaration were deleted. pip
      # resolution IS the positive control here: this line fails loudly on either.
      # It cannot prove the provider CONSTRUCTS — that needs the model weights, which CI
      # does not download — so the claim this job supports is exactly "the extra resolves
      # and einops is importable", and no more. einops is pure Python and ~60 KB.
      # `graph-viz` closes the identical class of gap uvicorn/watchfiles closed earlier:
      # tests/unit/test_graph_visualizer_escaping.py (SEC-04, the HTML-escaping /
      # XSS-prevention test for the pyvis graph export) does a module-scope
      # `pytest.importorskip("pyvis.network")`, and pyvis was declared by NO extra this
      # job installs — so on every CI run the whole file SKIPPED, silently, and the
      # security assertions inside it never executed. `graph-viz = ["pyvis>=0.3.2"]`
      # already existed in pyproject.toml (added for the runtime `--visualize` feature);
      # it is added here rather than folded into `dev` because `dev` is installed by
      # three OTHER jobs (lint, type-check-extras, integration) that never run
      # tests/unit at all, and pyvis pulls in ipython + its own dependency chain for no
      # benefit in any of them. `graph-viz` is the narrowest true fix: it is the exact
      # extra the feature under test already declares, added only to the one job whose
      # matrix actually executes tests/unit.
      - name: Install trelix + dev deps
        run: pip install -e ".[local,otel,sso,bge-code,nomic-code,dev,graph-viz]"
      - name: Install trelix-mcp + deps
        run: pip install -e packages/trelix-mcp
      # The `lint` job installed these two but never ran their tests, and this job ran
      # tests but never installed them, so packages/trelix-langchain/tests and
      # packages/trelix-llama-index/tests (19 + 10 = 29 tests) executed nowhere. Both
      # depend on the core being importable, which the editable install above provides;
      # these two only add langchain-core and llama-index-core. src/trelix references
      # neither, so this cannot move the coverage number gated below.
      - name: Install trelix-langchain + trelix-llama-index
        run: |
          pip install -e packages/trelix-langchain
          pip install -e packages/trelix-llama-index
      - name: Locate tree-sitter grammar cache dir
        id: ts-cache
        run: echo "dir=$(python -c 'from tree_sitter_language_pack import cache_dir; print(cache_dir())')" >> "$GITHUB_OUTPUT"
      - name: Cache tree-sitter grammars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.ts-cache.outputs.dir }}
          key: tree-sitter-language-pack-${{ hashFiles('pyproject.toml') }}
      - name: Prefetch tree-sitter grammars
        run: python -c "from trelix.indexing.parser._grammar import prefetch_all; prefetch_all()"
      # Same cache-then-prefetch shape as the grammars above, for the same reason: this job
      # runs with HF_HUB_OFFLINE=1 (see this job's `env:`), and 51 unit tests construct a
      # REAL embedder -- `SentenceTransformer(config.local_model)`, i.e.
      # sentence-transformers/all-MiniLM-L6-v2 -- so offline mode against a COLD cache
      # raises LocalEntryNotFoundError rather than skipping.
      #
      # That is not hypothetical. It is what the first push of this change did: 51 failed on
      # all four legs, while the same suite was green locally. The difference was a warm
      # ~/.cache/huggingface on the developer's machine. Reproduced deliberately with
      # HF_HOME pointed at an empty directory, which gave 51 failed / 3,555 passed --
      # matching CI exactly. A local pass on a warm cache is not evidence about CI.
      #
      # Offline is turned OFF for this ONE step so the download can happen, then the test
      # run itself stays hermetic behind the socket ban. Warming here rather than letting
      # the tests download is what keeps the ban meaningful: no test may open a socket, and
      # nothing in the test phase can silently start fetching from the Hub again.
      - name: Cache Hugging Face hub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-minilm-l6-v2-${{ hashFiles('pyproject.toml') }}
      - name: Prefetch the local embedder model
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
      # --cov is required for two things that were previously silently dead:
      # the htmlcov/ artifact uploaded below, and pyproject's
      # [tool.coverage.report] fail_under = 75 gate (pytest-cov reads
      # fail_under from the coverage config, so the gate only runs when
      # coverage is actually collected).
      #
      # --cov-fail-under=79 overrides that 75. Measured on this tree: the 2,861-test
      # unit suite covers 80.73% of 15,475 statements (2,982 missing), so a 75 gate
      # left 887 statements that could go uncovered without CI noticing — more than
      # the whole retrieval package. 79 cuts that free headroom to 268 statements
      # while keeping ~1.7 points of slack, which is what absorbs the one real source
      # of drift: this job installs [local,otel,sso,dev] whereas the measurement was
      # taken with every extra present, so import-guard fallbacks in the optional
      # backends are covered on the other side here. src/trelix contains no
      # sys.version_info branches (still 0 occurrences, re-verified when 3.14 was added,
      # and 0 in packages/*/src too), so the 3.11/3.12/3.13/3.14 matrix legs do not
      # diverge and the same number holds on all four.
      #
      # pyproject's fail_under stays 75 and now disagrees with CI; raise it to 79 so a
      # local `pytest --cov` fails for the same reason CI does.
      # `branch = true` is now set in pyproject's [tool.coverage.run], so the number this
      # step prints is combined line+branch and is NOT comparable with any figure recorded
      # before 2026-08-23. Measured on the full tree before enabling it: line-only 84.01%,
      # combined 80.76%, branch rate 71.46%. --cov-fail-under=79 therefore still clears, by
      # 1.76 points, and deliberately does not move -- see the pyproject comment for why the
      # 0.05-point margin an audit predicted was an extrapolation from the repo's worst area.
      #
      # --cov-report=json feeds the per-package floor check below. One global percentage
      # cannot say WHERE coverage fell, and it lets a rise in a well-covered package mask a
      # collapse in the extractors, which are simultaneously this repo's core value and its
      # weakest area.
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=src/trelix --cov-report=term-missing --cov-report=html --cov-report=json:coverage-unit.json --cov-fail-under=79
      # Deliberately a script run after the suite, not a pytest test. A test cannot read its
      # own run's coverage (pytest-cov writes at session finish), and a test that reads a
      # report file must skip when it is absent -- which in CI is produced by the very
      # command running the test. A check that can only skip is a green identical to a check
      # that never ran. Verified failing two ways before landing: a floor raised above
      # actual exits 1 naming the package, and a floor whose prefix matches no files exits 1
      # as DEAD rather than passing forever.
      - name: Check per-package coverage floors
        run: python scripts/check_coverage_floors.py coverage-unit.json
      - name: Run trelix-mcp tests
        run: pytest packages/trelix-mcp/tests/ -v --tb=short
      # Three separate invocations, not one. packages/trelix-langchain/tests and
      # packages/trelix-llama-index/tests each contain __init__.py and a file named
      # test_retriever.py, so both resolve to the module `tests.test_retriever`; a
      # single pytest that collects both dies with "import file mismatch: imported
      # module 'tests.test_retriever' has this __file__ attribute: .../
      # trelix-langchain/tests/test_retriever.py" and interrupts collection. Combining
      # them is not an option until one of the files is renamed. (trelix-mcp/tests has
      # no __init__.py, so its modules are top-level and do not collide — it is split
      # out only so a failure names the package.)
      - name: Run trelix-langchain tests
        run: pytest packages/trelix-langchain/tests/ -v --tb=short
      - name: Run trelix-llama-index tests
        run: pytest packages/trelix-llama-index/tests/ -v --tb=short
      # tests/integration/ runs in its own `integration` job below, not here —
      # it takes ~10 minutes, and putting it in this 3-version matrix would cost
      # ~30 minutes of runner time per push for no extra signal.
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: htmlcov/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Single Python version on purpose. The suite is end-to-end (real indexing,
    # real SQLite, spawned CLI subprocesses) and takes ~10 minutes; running it
    # across the 3-version matrix would cost ~30 minutes per push while
    # exercising the same code paths.
    #
    # This ran nowhere until the two blockers were fixed: one fixture indexed the
    # entire worktree, so 16 tests never completed (three timed-out attempts),
    # and 4 more failed because a developer .env leaked an embedder into spawned
    # subprocesses, which in-process monkeypatch isolation cannot reach.
    #
    # timeout-minutes is load-bearing rather than hygiene: "never completes" was
    # the original failure mode, so a regression there must fail the job in
    # minutes instead of occupying a runner until GitHub's 6-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install project + dev deps
        run: pip install -e ".[local,otel,sso,dev]"
      # The suite indexes fixture repos with the local embedder, so a fresh runner
      # has to download the sentence-transformers model on first use — HF_HUB_OFFLINE
      # is deliberately NOT set here. That download is the main reason this job is
      # slower and more network-dependent than the unit job; if it becomes a source
      # of flakes, cache ~/.cache/huggingface keyed on the model name rather than
      # forcing offline mode, which would just fail on a cold cache.
      # This ran with no --cov at all, so the only end-to-end suite in the repo — real
      # indexing, real SQLite, spawned CLI subprocesses — contributed nothing to any
      # coverage number and there was no way to see which paths it actually reaches.
      #
      # --cov-fail-under=0 is load-bearing: pytest-cov applies pyproject's
      # [tool.coverage.report] fail_under whenever coverage is collected, so simply
      # adding --cov here would gate an integration-only run against the 79% written
      # for the 2,861-test unit suite and fail this job on the first push.
      #
      # This is visibility, not a second gate, and it undercounts twice over: there is
      # no cross-job `coverage combine` (unit and integration run on separate runners),
      # and the tests that spawn `trelix` as a subprocess are not measured at all
      # without COVERAGE_PROCESS_START wiring. Treat the artifact as "which end-to-end
      # paths are exercised", never as a coverage percentage.
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --cov=src/trelix --cov-report=term-missing --cov-report=html --cov-fail-under=0
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-integration
          path: htmlcov/
          if-no-files-found: warn

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Real subprocesses (trelix-mcp over stdio, fresh venv pip installs of freshly-built
    # wheels), never mocks — this is the exact class of process-boundary coverage that
    # would have caught the 3.2.1 defects (trelix-mcp missing from the Docker image;
    # its console script silently ignoring --help/--version/any flag). Neither defect
    # was visible to any in-process test: Click's CliRunner and the MCP SDK's in-memory
    # Client are both documented as in-process doubles that cannot observe a real fd/
    # process boundary. See tests/e2e/ for the tests themselves.
    #
    # tests/e2e/test_mcp_stdio_e2e.py::test_search_code_finds_real_results_in_a_real_index
    # DOES construct a real local embedder: it indexes a real fixture repo with
    # EmbedderConfig(provider="local"), then trelix-mcp's own subprocess builds its own
    # Retriever against it. No HF_HUB_OFFLINE dance is needed to make that safe, unlike
    # ci.yml's `test` job: tests/e2e/conftest.py auto-applies `enable_socket` +
    # `requires_network` to everything under this directory, so this job can reach
    # huggingface.co directly. The cache step below is a pure speed optimisation (skip a
    # redundant cold model download on every run), not a correctness requirement.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + dev deps
        run: pip install -e ".[local,otel,sso,dev]"
      - name: Install trelix-mcp, trelix-langchain, trelix-llama-index
        run: pip install -e packages/trelix-mcp -e packages/trelix-langchain -e packages/trelix-llama-index
      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-minilm-l6-v2-${{ hashFiles('pyproject.toml') }}
      - name: Run E2E suite
        run: pytest tests/e2e/ -v --tb=short

  typescript-sdk:
    name: TypeScript SDK
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/trelix-typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  docker-build:
    name: Docker build smoke test
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing for the "Detect Docker-relevant changes"
      # step below: it needs both the PR base commit and the pre-push commit
      # present locally to diff against, and a shallow (depth-1) checkout has
      # neither.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build slim image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: EXTRAS=serve
          tags: trelix:ci-test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image runs
        run: docker run --rm trelix:ci-test --help
      - name: Verify trelix-mcp is present in the image
        run: docker run --rm --entrypoint trelix-mcp trelix:ci-test --version
      # The -local variant (EXTRAS=serve,local) bundles torch/sentence-transformers and
      # is materially heavier to build than the slim image above — the Dockerfile's own
      # comments document a past hosted-runner disk-space incident from this exact
      # build target. Running it unconditionally on every push/PR would add real
      # minutes to CI for no signal on changes that can't affect the Docker image at
      # all, so it is gated to only run when the diff actually touches something that
      # could change what gets built (Dockerfile itself, or the dependency/extras
      # declarations in pyproject.toml).
      #
      # This repo doesn't use dorny/paths-filter or tj-actions/changed-files anywhere
      # else (every other conditional in these workflows is plain git/bash), so a
      # plain `git diff --name-only` step is used here too rather than introducing a
      # new third-party action dependency for a two-line check.
      #
      # Defaults to changed=true (i.e. build it) whenever the comparison point can't
      # be resolved — e.g. the very first commit on a new default branch, where
      # `github.event.before` is all-zeros — so an inability to detect never silently
      # skips the smoke test; it only skips when the diff was actually computed and
      # came back clean.
      - name: Detect Docker-relevant changes
        id: docker-relevant-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed="true"
          # packages/trelix-mcp/pyproject.toml is included because the root Dockerfile's
          # builder stage COPYs and pip-installs packages/trelix-mcp/ into both image
          # variants; a version/dependency bump there can change what actually ships. The
          # other two sub-packages (trelix-langchain, trelix-llama-index) are deliberately
          # excluded — the Dockerfile never COPYs either into the image, so a change to
          # their pyproject.toml cannot affect what this job smoke-tests.
          docker_relevant_pattern='^(Dockerfile|pyproject\.toml|packages/trelix-mcp/pyproject\.toml)$'
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            files="$(git diff --name-only "$BASE_SHA" HEAD)"
            if echo "$files" | grep -qE "$docker_relevant_pattern"; then
              changed="true"
            else
              changed="false"
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE_SHA" HEAD)"
            if echo "$files" | grep -qE "$docker_relevant_pattern"; then
              changed="true"
            else
              changed="false"
            fi
          fi
          echo "Docker-relevant files touched: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # Mirrors the slim steps above exactly, per the EXTRAS=serve,local <-> -local
      # convention already used in docker-publish.yml. Uses a distinct gha cache scope
      # (scope=local) so the slim and local builds' layer caches don't collide and
      # overwrite each other.
      - name: Build local image
        if: steps.docker-relevant-changes.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: EXTRAS=serve,local
          tags: trelix:ci-test-local
          push: false
          load: true
          cache-from: type=gha,scope=local
          cache-to: type=gha,mode=max,scope=local
      - name: Verify local image runs
        if: steps.docker-relevant-changes.outputs.changed == 'true'
        run: docker run --rm trelix:ci-test-local --help
      - name: Verify trelix-mcp is present in the local image
        if: steps.docker-relevant-changes.outputs.changed == 'true'
        run: docker run --rm --entrypoint trelix-mcp trelix:ci-test-local --version
      - name: Verify torch/sentence-transformers actually import in the local image
        if: steps.docker-relevant-changes.outputs.changed == 'true'
        run: docker run --rm --entrypoint python trelix:ci-test-local -c "import torch, sentence_transformers"
