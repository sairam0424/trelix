# Default values for the trelix chart.
# See README.md for the repo model this chart assumes (shared multi-repo PVC)
# and the security posture (no auth on the REST API — ingress disabled by default).

replicaCount: 1

image:
  # :3.1.5 is the slim, API-embedder-only tag. Use the "-local" suffix
  # (e.g. 3.1.5-local) for the variant bundling sentence-transformers/torch.
  #
  # This tag MUST equal Chart.yaml's appVersion. It sat on 2.12.0 while
  # appVersion was bumped by all five releases since, so the chart advertised
  # 3.1.2 and deployed 2.12.0 — `helm install` at defaults ran an image five
  # releases behind the version the chart claimed to be.
  # CONTRIBUTING.md's checklist could not catch it: it greps for the PREVIOUS
  # version, which never matches a site stranded on 2.x. release.yml's
  # verify-version job now compares this line against the release tag.
  repository: ghcr.io/sairam0424/trelix
  tag: "3.5.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # Whether the pod gets a Kubernetes API token mounted. Off: trelix never calls the Kubernetes
  # API (neither src/ nor packages/*/src has a client), so a token in the pod is only something
  # a compromised process could use. A sidecar or injector that authenticates with the pod's
  # token (a Vault agent injector, say) needs true. Written onto the pod spec, where it wins
  # over the ServiceAccount's own setting.
  automount: false

# trelix serve's REST API has zero auth middleware. Only enable ingress once
# you've fronted it with an authenticating proxy (see README.md's Security section).
service:
  type: ClusterIP
  port: 8765

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: trelix.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# One PVC, shared across every repo this server indexes/serves — see README.md.
# Pass `repo=/data/<name>` (an absolute path inside this volume) on every
# REST request. Disabling this only makes sense if store.backend is qdrant
# AND you never intend to call POST /index (no local checkout to read from).
persistence:
  enabled: true
  mountPath: /data
  size: 10Gi
  storageClassName: ""
  accessMode: ReadWriteOnce
  existingClaim: ""

# fsGroup grants the container's (non-root) process group-write access to the
# mounted PVC without needing to know its exact UID (the Dockerfile's `trelix`
# user has no pinned UID — see Dockerfile). Kubernetes adds this GID as a
# supplemental group and chowns the volume at mount time.
# seccompProfile RuntimeDefault is the container runtime's default syscall filter; it needs
# Kubernetes 1.19 (Chart.yaml's kubeVersion). To drop only that: `--set podSecurityContext.seccompProfile=null`.
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Applied to every container in the pod (trelix, and trelix-mcp when it is on). To remove all of
# it, set `securityContext: null` (an empty map `{}` is MERGED with these defaults by Helm and
# removes nothing). Three more settings are off by default and documented in README.md ("Opt-in
# hardening"); each is one key here, and the chart reacts to the first:
#   readOnlyRootFilesystem: true   # the chart then mounts writable emptyDirs at /tmp and /cache
#   runAsNonRoot: true             # needs runAsUser: the image's USER is a name, not a number,
#   runAsUser: 999                 # and the kubelet refuses runAsNonRoot without a numeric one.
#   runAsGroup: 999                # 999 is what the published images use; check yours.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Requests only. They are the scheduler's floor and give the pod a QoS class above BestEffort;
# they are not a measurement of any workload. There is deliberately NO default limit: a memory
# limit that is too low OOM-kills the pod in the middle of indexing a large repository (the
# "-local" image also loads torch and an embedding model), and a CPU limit throttles the bursty
# parse and embed phases. Add limits once you have measured your largest repository. To size up:
#   resources:
#     requests:
#       cpu: 500m
#       memory: 1Gi
#     limits:
#       memory: 4Gi   # example only
# To drop the requests: `resources: null` (as with securityContext, `{}` removes nothing).
resources:
  requests:
    cpu: 250m
    memory: 512Mi

# NetworkPolicy — opt-in, Ingress only (egress stays open: tree-sitter grammars are downloaded
# from github.com on first use, and the embedder and Qdrant endpoints are outbound too). When
# enabled, the pod accepts connections on the REST port (and the trelix-mcp port when that is on)
# only from pods in the release namespace plus the peers in ingressFrom. ingressFrom takes
# NetworkPolicyPeer entries (podSelector / namespaceSelector / ipBlock), e.g. the ingress
# controller's namespace. The chart refuses to render the policy with ingress.enabled or a
# service.type other than ClusterIP and no ingressFrom, since that would cut off the traffic
# the Ingress or the Service exists to carry. Needs a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  ingressFrom: []
# - namespaceSelector:
#     matchLabels:
#       kubernetes.io/metadata.name: ingress-nginx

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# trelix StoreConfig — mirrors src/trelix/core/config.py's StoreConfig fields
# and env var aliases exactly.
# ---------------------------------------------------------------------------
store:
  backend: sqlite # sqlite | qdrant | lance

  hnsw: true
  hnswM: 16
  hnswEfSearch: 50
  bm25ReadPoolSize: 0

  qdrant:
    # Qdrant is NOT deployed by this chart — bring your own (Qdrant Cloud or
    # self-hosted). See README.md's "Qdrant is external" section for why.
    url: "http://localhost:6333"
    collection: trelix
    preferGrpc: false
    timeout: 10.0
    # Set one of these for QDRANT_API_KEY. apiKey is a plaintext values.yaml
    # convenience for local/dev use — prefer existingSecretName in any shared
    # cluster.
    apiKey: ""
    existingSecretName: ""
    existingSecretKey: "QDRANT_API_KEY"

  lance:
    uri: ".trelix/lance"
    table: chunks

# Embedder provider credentials. Same apiKey/existingSecretName pattern as
# store.qdrant above — set at most one of the two per provider.
embedder:
  openai:
    apiKey: ""
    existingSecretName: ""
    existingSecretKey: "OPENAI_API_KEY"
  voyage:
    apiKey: ""
    existingSecretName: ""
    existingSecretKey: "VOYAGE_API_KEY"
  cohere:
    apiKey: ""
    existingSecretName: ""
    existingSecretKey: "COHERE_API_KEY"

# REST API auth — opt-in. Unset (both fields empty) leaves every route open,
# matching trelix serve's own default. Set one of these to require an
# `X-Trelix-Api-Key` header on every route except /health before enabling
# ingress. Same apiKey/existingSecretName pattern as store.qdrant above.
apiAuth:
  token: ""
  existingSecretName: ""
  existingSecretKey: "TRELIX_API_AUTH_TOKEN"

# Plain (non-secret) extra environment variables, e.g. TRELIX_EMBEDDER_PROVIDER=openai.
extraEnv: []
# - name: TRELIX_EMBEDDER_PROVIDER
#   value: openai

# Extra env vars sourced from an existing Secret, for credentials this chart
# doesn't already model above.
extraSecretEnv: []
# - name: AZURE_OPENAI_API_KEY
#   secretName: my-azure-secret
#   secretKey: api-key

# trelix-mcp — MCP over Streamable HTTP, as a second container in the same pod, sharing the
# PVC. Off by default. Needs a token (it binds 0.0.0.0 in the pod and exits 2 without one, so
# the chart refuses to render without one) and persistence.enabled (it serves the repositories
# under persistence.mountPath). The token is its own, NOT apiAuth's. The chart adds the
# release's Service names to the Host allow-list itself; list any other name a client sends
# in allowedHosts (an Ingress host, the `.svc.cluster.local` form). Same token pattern as
# apiAuth above: set at most one of token / existingSecretName. image.tag must be a release
# whose trelix-mcp has `--transport http`. See README.md.
mcp:
  enabled: false
  port: 8766
  allowedHosts: []
  auth:
    token: ""
    existingSecretName: ""
    existingSecretKey: "TRELIX_MCP_AUTH_TOKEN"
  # Resources for the trelix-mcp container only; `resources` above sizes the trelix one.
  resources: {}
