apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trelix.fullname" . }}
  labels:
    {{- include "trelix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trelix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trelix.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trelix.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: trelix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /repo is the vestigial CLI positional argument (see README.md —
          # create_app() never actually reads it; every route re-derives its
          # own IndexConfig from the request's `repo` query param). Kept
          # pointed at the shared data dir for a sane startup log line only.
          args: ["serve", "{{ .Values.persistence.mountPath }}", "--host", "0.0.0.0", "--port", "{{ .Values.service.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            {{- include "trelix.storeEnv" . }}
            {{- if .Values.apiAuth.existingSecretName }}
            - name: TRELIX_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiAuth.existingSecretName }}
                  key: {{ .Values.apiAuth.existingSecretKey }}
            {{- else if .Values.apiAuth.token }}
            - name: TRELIX_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "trelix.fullname" . }}
                  key: TRELIX_API_AUTH_TOKEN
            {{- end }}
            {{- include "trelix.extraEnv" . }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "trelix.pvcName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
