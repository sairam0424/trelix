{{- include "trelix.mcpChecks" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trelix.fullname" . }}
  labels:
    {{- include "trelix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trelix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /*
      The credentials this chart's own Secret holds reach the containers as environment
      variables, which are read once, when a container starts. A changed Secret alone rolls
      nothing, so the old value stays accepted until the pod restarts; hashing the rendered
      Secret into the pod template makes `helm upgrade` roll the pod when any of them changes.
      With no value to hold the Secret renders only a newline; `trim` turns that into the empty
      string, which `with` skips, so then no annotation is written.
      A Secret the chart does not own (an existingSecretName) cannot be hashed here.
      */}}
      {{- with (include (print $.Template.BasePath "/secret.yaml") . | trim) }}
      annotations:
        checksum/secret: {{ . | sha256sum }}
      {{- end }}
      labels:
        {{- include "trelix.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trelix.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: trelix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /repo is the vestigial CLI positional argument (see README.md —
          # create_app() never actually reads it; every route re-derives its
          # own IndexConfig from the request's `repo` query param). Kept
          # pointed at the shared data dir for a sane startup log line only.
          args: ["serve", "{{ .Values.persistence.mountPath }}", "--host", "0.0.0.0", "--port", "{{ .Values.service.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            {{- include "trelix.storeEnv" . }}
            {{- if .Values.apiAuth.existingSecretName }}
            - name: TRELIX_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiAuth.existingSecretName }}
                  key: {{ .Values.apiAuth.existingSecretKey }}
            {{- else if .Values.apiAuth.token }}
            - name: TRELIX_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "trelix.fullname" . }}
                  key: TRELIX_API_AUTH_TOKEN
            {{- end }}
            {{- include "trelix.extraEnv" . }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.mcp.enabled }}
        - name: trelix-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The image's entrypoint is `trelix`; MCP over HTTP is the other console script. It
          # serves the repositories under the PVC mount and binds 0.0.0.0 so the Service reaches it.
          command: ["trelix-mcp"]
          args: ["--transport", "http", "--host", "0.0.0.0", "--port", "{{ .Values.mcp.port }}", "--root", "{{ .Values.persistence.mountPath }}"]
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          # GET /health is exempt from the Host check and from the token, so the kubelet's
          # probe (Host: <pod-ip>:<port>, no credential) passes.
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            {{- include "trelix.storeEnv" . }}
            {{- if .Values.mcp.auth.existingSecretName }}
            - name: TRELIX_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.auth.existingSecretName }}
                  key: {{ .Values.mcp.auth.existingSecretKey }}
            {{- else }}
            - name: TRELIX_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "trelix.fullname" . }}
                  key: TRELIX_MCP_AUTH_TOKEN
            {{- end }}
            - name: TRELIX_MCP_ALLOWED_HOSTS
              value: {{ include "trelix.mcpAllowedHosts" . | quote }}
            {{- include "trelix.extraEnv" . }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "trelix.pvcName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
