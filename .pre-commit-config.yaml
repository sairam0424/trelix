repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "\\.md$"
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings]
        args: [--ignore-missing-imports]
        files: ^src/

  # Secret scanning. There was none anywhere in the project — not here, not in CI —
  # for a repo that publishes four PyPI packages and two container images.
  #
  # Prefix-matching alone would not have caught what is in this working tree: the AWS
  # credential pair in the local .env is base64-wrapped, so `AKIA…` never appears and
  # every AKIA-prefix scanner, including GitHub's push protection, reads it as clean.
  # gitleaks matches on entropy and context as well as prefixes.
  #
  # .env is gitignored and absent from history, so this is prophylactic rather than
  # remedial — the point is that nothing was watching, and a single `git add -f` or a
  # renamed copy (`env.backup`, `.env.prod`) would have gone straight through.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
