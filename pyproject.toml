[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trelix"]

# Local-build hygiene, not a change to what ships. CI publishes from a clean
# checkout where none of these exist, so the released sdist is ~1.9 MiB either way.
# But hatchling does not honour NESTED .gitignore files, and
# workspace-vscode/.gitignore ignores .vscode-test/ — which @vscode/test-electron
# fills with three ~900 MB VS Code app bundles. A developer who runs the extension
# tests and then `python -m build` gets a 928 MB sdist with 2.6 GB of Electron
# inside it. Excluding them here makes a local build match what CI produces.
[tool.hatch.build.targets.sdist]
exclude = [
  "**/node_modules",
  "**/.vscode-test",
  "**/dist",
  "**/out",
  "**/.next",
  "scratch-pad",
  "htmlcov",
  ".venv",
  # Same nested-.gitignore mechanism as .vscode-test above, and a worse payload. Root
  # .gitignore has `.trelix/`, which does not match a RENAMED index directory, so
  # `.trelix.bak-selfindex/` is hidden from git only by its own nested .gitignore containing
  # `*` — which hatchling does not honour. Measured on this checkout: it holds 329 MB,
  # including a 221 MB index.db, a pre-v3.1.2 384-dim backup, and 2,479 query-trace JSONs
  # WHOSE FILENAMES ARE THE QUERY TEXT. A local `make build` produced a 158 MiB sdist and
  # `make check-dist` (twine check) passed it. CI is unaffected — it builds from a fresh
  # checkout — but the documented local pre-flight was one `twine upload` away from
  # publishing an index and a list of someone's queries. Glob covers any `.trelix*` name.
  "**/.trelix*",
]

[project]
name = "trelix"
version = "3.2.2"
description = "Fast, reliable code indexing and retrieval — contextual hybrid search, adaptive planning, call-graph expansion, LLM synthesis"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Trelix Contributors" }]
requires-python = ">=3.11"
keywords = [
    "code-search", "code-intelligence", "tree-sitter", "semantic-search",
    "hybrid-search", "llm", "rag", "developer-tools", "code-indexing",
    "mcp", "model-context-protocol", "ast", "vector-search", "bm25",
    "call-graph", "embeddings", "openai", "langchain", "llama-index",
    "code-assistant", "code-retrieval", "static-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # requires-python is an open ">=3.11", so pip has always been willing to install on
    # 3.14 — the classifiers were the only place claiming otherwise, and they said 3.13.
    # Added once the suite was actually run there rather than on the strength of the
    # open bound: 3.14.6, every extra installed, 3256 passed, 0 skipped, 0 failed.
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # --- Parsing ---
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.13.0",
    "PyYAML>=6.0",
    # --- Storage ---
    "sqlite-vec>=0.1.6",
    # --- Embeddings ---
    "openai>=1.35.0",
    "tiktoken>=0.7.0",
    # --- Retrieval math ---
    # scikit-learn was an unconditional core dependency with zero importers.
    # `rg 'sklearn|scikit_learn|from scipy|import scipy' src/ packages/ tests/
    # scripts/ eval/` matches nothing, and importing all 142 modules under
    # src/trelix with sklearn, scipy, joblib and threadpoolctl blocked at
    # __import__ raises no error. It cost every `pip install trelix` 120 MB
    # measured in this venv (scipy 82, sklearn 36, joblib 2, threadpoolctl <1).
    # trelix.spec already lists 'sklearn'/'scipy'/'scikit_learn' in excludes, so
    # the shipped binary never contained them — the exclusion was the tell.
    # Users on the local provider still get them transitively:
    # sentence-transformers requires scikit-learn>=0.22.0 and scipy>=1.0.0.
    "numpy>=1.26.0",
    # --- File walking ---
    "pathspec>=0.12.1",
    # --- CLI ---
    "typer>=0.12.0",
    "rich>=13.7.0",
    # --- Config ---
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    # --- Secure XML parsing (XXE/billion-laughs protection for .csproj) ---
    "defusedxml>=0.7.1",
    # --- Graph (PageRank) ---
    "networkx>=3.3.0",
    # --- Retry/backoff (LLM, embedder, and connector HTTP calls) ---
    "tenacity>=8.5.0",
    # --- HTTP client (connectors, GitHub PR client) — was only ever
    # transitively installed via openai/anthropic/etc.; declared explicitly
    # now that core/retry.py's error-classification imports it directly ---
    "httpx>=0.27",
    # --- Structured logging (unifies stdlib logging + JSON server output) ---
    "structlog>=24.1.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0.0",  # LocalEmbedder + CrossEncoder reranker
]
rerank = [
    "cohere>=5.5.0",                  # Cohere reranker (best quality)
]
plaid = [
    "ragatouille>=0.0.8",             # PLAID ColBERT late-interaction reranker
]
voyage = [
    "voyageai>=0.2.0",               # VoyageEmbedder (voyage-code-3, 56.26 CoIR)
]
bge-code = [
    # EXPERIMENTAL provider. The wrapper builds FlagEmbedding's `FlagModel`, which is the
    # ENCODER-only `BaseEmbedder` (DEFAULT_POOLING_METHOD = "cls"), while BAAI publishes
    # BAAI/bge-code-v1 as a causal Qwen2 decoder with `pooling_mode_lasttoken: true`.
    # Pooling is unverified, so no retrieval-quality claim is made for this extra.
    # See docs/PROVIDERS.md.
    "FlagEmbedding>=1.3.0",           # BGE-Code-v1 and family
]
nomic-code = [
    "sentence-transformers>=3.0.0",  # already in [local], duplicated for clarity
    # REQUIRED, not optional. nomic-ai/CodeRankEmbed's config.json declares
    # `auto_map.AutoModel = modeling_hf_nomic_bert.NomicBertModel`, and that published
    # module imports einops at its TOP LEVEL — so the import runs during the
    # trust_remote_code load, before any trelix code sees the model. einops was declared by
    # no extra, so this provider raised ModuleNotFoundError from inside remote model code
    # for every user who ever selected it: it has never once constructed. Nothing else
    # installed pulls einops in transitively.
    "einops>=0.7.0",
]
sparse = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
qdrant = [
    "qdrant-client>=1.9.0,<2.0.0",     # Qdrant HNSW vector backend (optional)
]
lance = [
    "lancedb>=0.6.0",                  # LanceDB ARM-native HNSW vector backend (optional)
    "pyarrow>=14.0",
]
watch = [
    "watchdog>=4.0.0",               # Filesystem event monitoring for `trelix watch`
    # `trelix watch-all` uses watchfiles.awatch(), not watchdog — a different library for
    # the multi-repo path. Without it this extra could not satisfy the very command whose
    # ImportError tells the user to install `trelix[watch]`
    # (indexing/multi_watcher.py:30-38), so following the error message did not help.
    # It went unnoticed locally because uvicorn[standard], via the `serve` extra, pulls
    # watchfiles in transitively.
    "watchfiles>=0.21.0",
]
serve = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]
sso = [
    "pyjwt[crypto]>=2.9",             # OIDC JWT verification (RS256/ES256)
]
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-util-genai>=1.0b0",  # gen_ai.* retrieval/embedding spans (Development stability)
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",  # only used if OTEL_EXPORTER_OTLP_ENDPOINT is set
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    # Guards, not conveniences -- each closes a named incident. pytest-socket bans
    # outbound sockets in the unit suite (a harness reached a paid endpoint and got a
    # live 401); pytest-timeout fails a hung test instead of wedging the run (a `trelix
    # watch` test hung the suite until killed). Both are pinned by
    # tests/unit/test_network_is_blocked.py and the --timeout entry in addopts.
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.3.0",
    # tests/property/ -- Hypothesis-based property tests (Phase 9). Pinned >=6.100 for
    # the current `@given`/`settings(max_examples=...)` API used there; no lower floor
    # measured beyond "the API these tests call exists".
    "hypothesis>=6.100.0",
    "ruff>=0.15.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pyinstaller>=6.0.0",
    # Kept, but the old comment ("httpx2 replaces httpx") was wrong and the floor
    # was fiction. httpx2 is pydantic/httpx2 by the httpx author, not a third-party
    # fork, and it has no 0.x line at all — PyPI lists 0.0.0 then 2.0.0..2.10.0, so
    # `>=0.27` only worked by accidentally excluding the 0.0.0 placeholder. Starlette
    # 1.3.1's testclient.py does `import httpx2 as httpx`, falls back to httpx, and
    # only raises if neither is present; verified by blocking httpx2 at __import__ and
    # driving a TestClient — requests still pass 200 but emit
    # "StarletteDeprecationWarning: Using `httpx` with `starlette.testclient` is
    # deprecated". So httpx2 is not required, it is the supported path (Starlette
    # marks its own httpx fallback `# pragma: no cover`) and it keeps the 45
    # TestClient(...) constructions in tests/unit off a deprecated branch. Starlette
    # declares httpx2>=2.0.0, but only under its `full` extra, which trelix does not
    # install — hence this explicit line. Floor matched to Starlette's.
    "httpx2>=2.0.0",    # starlette.testclient's preferred client; core httpx stays
    "fastapi>=0.111.0", # REST API tests (tests/unit/test_api.py)
    # Direct test dependencies, not transitive conveniences. Before this pin, neither
    # was declared by ANY trelix extra: both reached the unit job only because
    # packages/trelix-mcp's own dependencies (mcp>=1.24 -> uvicorn; fastmcp>=3.4 ->
    # fastmcp-slim[server] -> watchfiles) happen to install them as a side effect of a
    # step that runs after this extra in ci.yml. That made
    # tests/unit/test_api_containment.py's bare `import uvicorn` and
    # tests/unit/test_multi_watcher{,_filtering}.py's `pytest.importorskip("watchfiles")`
    # hostage to trelix-mcp's own dependency graph -- a floor bump or an extras
    # reshuffle there could silently start skipping/erroring these tests with no change
    # to this repo. `dev` is installed by every job that runs `tests/unit`
    # (lint/type-check-extras/test/integration all include it), so declaring them here
    # keeps the guarantee independent of packages/trelix-mcp. Floors matched to the
    # runtime extras that already carry these packages ([serve]'s uvicorn,
    # [watch]'s watchfiles) so `dev` never demands a version [serve]/[watch] would reject.
    "uvicorn>=0.29.0",
    "watchfiles>=0.21.0",
]
binary = [
    "pyinstaller>=6.0.0",
    "sentence-transformers>=3.0.0",   # local embedder bundled into the binary
]
taint = [
    "semgrep>=1.60.0",
]
anthropic = ["anthropic>=0.40.0"]
bedrock   = ["boto3>=1.35.0"]
vertex    = ["google-genai>=1.0.0"]
litellm   = ["litellm>=1.50.0"]
llm-all   = ["trelix[anthropic,bedrock,vertex,litellm]"]
graph-viz = ["pyvis>=0.3.2"]
knowledge-graph = ["networkx>=3.3.0", "pyvis>=0.3.2"]
# `all` previously resolved to local,rerank,voyage,qdrant,watch,sso, which silently
# omitted three shipped, documented features: `trelix serve` (docs/FAQ.md:520 and
# docs/AUDIT.md:18 both instruct `pip install 'trelix[serve]'`), OTel export
# (docs/CONFIGURATION.md:293), and the pyvis graph export (CONTRIBUTING.md:97).
# `pip install trelix[all]` then `trelix serve` was an ImportError.
#
# The line drawn here: every runtime extra EXCEPT the four below, each excluded for a
# reason verified against installed metadata rather than assumed —
#   plaid      ragatouille requires llama-index, langchain, langchain_core, faiss-cpu,
#              colbert-ai and onnx; two whole LLM frameworks for one reranker.
#   bge-code   FlagEmbedding requires torch, transformers, datasets, accelerate and
#              peft — a fine-tuning stack, not an inference dependency.
#   taint      semgrep is LGPLv2 (its only License classifier); trelix is MIT, so a
#              copyleft dep belongs behind an explicit opt-in, not inside `all`.
#   lance      lancedb requires pyarrow>=16 (~120 MB of Arrow wheels) and is an
#              alternative to the qdrant backend already here, not an addition.
# `sparse` IS included: it asks for transformers+torch, both of which `local` already
# pulls in (sentence-transformers requires torch>=1.11.0 and transformers>=4.41.0),
# so it adds no new install weight. `dev` and `binary` are test/build tooling and
# stay out of a runtime aggregate. The LLM backends keep their own `llm-all` aggregate
# and are not folded in here: openai is a core dependency, so synthesis works without
# them. Not verified: that this set co-resolves on a clean index — every member is
# present together in the maintainer venv, which is evidence but not a fresh resolve.
all = [
    "trelix[local,rerank,voyage,sparse,qdrant,watch,serve,sso,otel,knowledge-graph]",
]

[project.scripts]
trelix = "trelix.cli.main:app"

[project.urls]
Homepage = "https://github.com/sairam0424/trelix"
Repository = "https://github.com/sairam0424/trelix"
Documentation = "https://github.com/sairam0424/trelix#readme"
Changelog = "https://github.com/sairam0424/trelix/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/sairam0424/trelix/issues"
"MCP Server" = "https://pypi.org/project/trelix-mcp/"
"LangChain" = "https://pypi.org/project/trelix-langchain/"
"LlamaIndex" = "https://pypi.org/project/trelix-llama-index/"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S (flake8-bandit) and B (flake8-bugbear) were both absent, so `ruff check` was
# blind to the entire security-lint category. Demonstrated on a scratch file:
# under the old select, `subprocess.run(cmd, shell=True)`, `hashlib.md5()`,
# `except Exception: pass` and `def f(x: list = [])` produced exactly one
# diagnostic between them — I001, for the import order.
#
# Turning them on surfaces 4,866 pre-existing violations across the paths CI lints
# (src/ 90, tests/ 4,560, scripts/ 3, packages/ 213). None are fixable from this
# file, so they are deferred below rather than left to break the build — but every
# deferral is named, counted, and scoped as narrowly as the violation set allows,
# and the ~50 other S/B rules that fire nowhere today are now enforced going forward.
select = ["E", "F", "I", "UP", "S", "B"]

# Tree-wide defers. Each of these fires inside src/trelix, so no per-directory scope
# would help; counts are for src/ + tests/ + scripts/ + packages/ as CI lints them.
# Every entry is real debt to be paid down, not a rule we disagree with.
ignore = [
    "S110",  # 22 try/except/pass — 13 in core/retry.py alone, the exact "silent
             # failure" shape this release exists to remove. Highest-value first fix.
    "S608",  # 15 f-string SQL — 10 in store/db.py, 2 in store/sparse_store.py.
             # Interpolated identifiers (table/column names), not user values; needs
             # an allow-list check at each site before the rule can be enforced.
    "S607",  # 21 partial executable paths ("git", "semgrep") — 19 of them in tests.
             # Fixing means resolving via shutil.which() in review/diff_parser.py and
             # store/provenance.py.
    "B905",  # 18 zip() without strict= — 11 in src (5 in indexing/indexer.py). Each
             # needs a decision on whether length mismatch is a bug or expected.
    "B904",  # 10 raise-without-from inside except — 8 in cli/main.py, where it
             # deliberately hides tracebacks from CLI users; needs `from None`.
    "S603",  # 9 subprocess calls without shell=False review. All take fixed argv
             # lists, never a shell string, so this is annotation work.
    "S324",  # 2 hashlib.md5 — indexing/multi_watcher.py uses it as a change-detection
             # hash, not a security primitive; needs usedforsecurity=False.
    "S112",  # 2 try/except/continue — federation/retriever.py, review/diff_embedder.py.
    "S310",  # 1 urlopen in auth/oidc.py (OIDC JWKS fetch); needs a scheme check.
    "B007",  # 1 unused loop variable in parser/extractors/css.py.
]

[tool.ruff.lint.per-file-ignores]
# pytest rewrites bare `assert`, so S101 in a test file flags the assertion mechanism
# itself: 4,495 hits in tests/ and 203 in packages/*/tests. This is permanent, not a
# defer. The other rules here are the same story for test fixtures — deliberately fake
# credentials, /tmp paths, and `pytest.raises(Exception)` in tests that assert only
# that *something* failed.
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "B011", "B017", "B018"]
"packages/*/tests/**" = ["S101", "S105", "S106", "S107", "S108", "B011", "B017", "B018"]
# Unlike the above, this one IS a defer: 26 asserts across 20 files under src/trelix
# (connectors 9, llm/providers 5, parser/extractors 4, retrieval 4, other 4) are used
# as runtime invariants and vanish under `python -O`. Scoped to src rather than put in
# the global ignore above so S101 stays enforced in scripts/ and any new top-level
# code; delete this line once those 26 become explicit raises.
"src/trelix/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trelix.indexing.multi_watcher"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit, because pytest-asyncio warns when it is unset and `strict` below turns
# config-parse warnings into errors. "function" is also what the suite already gets by
# default, so this pins current behaviour rather than changing it.
asyncio_default_fixture_loop_scope = "function"
# pytest 9's umbrella switch: strict_config + strict_markers + strict_xfail +
# strict_parametrization_ids. Each half earns its keep here:
#   strict_config  -- an unknown or misparsed key in THIS section becomes an error
#                     instead of a warning nobody reads. This repo configures
#                     pytest-asyncio, pytest-socket, pytest-timeout and pytest-cov, so a
#                     renamed ini key is a live risk.
#   strict_markers -- already on via addopts; kept there too, explicitly.
#   strict_xfail   -- an xfail that starts passing must fail the run, else a fixed defect
#                     keeps its "known failure" label forever. All xfails on this tree
#                     already declare strict=True with raises=, so this changes nothing
#                     today and closes the door on the next one that forgets.
#   strict_parametrization_ids -- non-unique parameter-set ids become an error. With
#                     duplicate ids `-k` cannot address a single case and a failure report
#                     cannot say WHICH one broke.
strict = true
# --strict-markers makes `@pytest.mark.<unregistered>` a collection error, so a
# typo in the name tests/integration/conftest.py applies fails loudly instead of
# tagging nothing. It does NOT validate `-m` expressions: a typo there still
# deselects nothing silently, which is why the marker below must stay registered
# and applied rather than relying on the flag alone.
# --disable-socket --allow-unix-socket: the unit suite may not reach the network.
#   48.3% of this suite's wall clock (238.75s of 494.70s) was live HTTP to
#   huggingface.co, and three separate audit runs spent real Azure OpenAI and AWS
#   Bedrock money merely by collecting and running tests. The allowance is mandatory,
#   not a loophole: `asyncio_mode = "auto"` builds an event loop per async test and that
#   construction calls socket.socketpair(), so bare --disable-socket measured 76 failures
#   in a 1,054-test slice -- every one from loop setup, none a real network call. With the
#   Unix allowance: 0 failures across 2,172 tests. Both halves are pinned by
#   tests/unit/test_network_is_blocked.py, which is this flag's positive control.
#   Tests that legitimately need the network carry @pytest.mark.requires_network and
#   pytest-socket's own @pytest.mark.enable_socket.
# --timeout=60 --timeout-method=signal: a hung test must fail, not wedge the run. A test
#   driving `trelix watch` previously hung the suite until it was killed by hand. 60s is
#   ~5x headroom, measured: with the network closed the slowest unit test is 6.22s and
#   everything after the top two is <=0.71s. `signal` (the default) rather than `thread`
#   deliberately -- thread's hard os._exit() destroys the traceback in exactly the
#   watcher/asyncio code you need it for, and no trelix source installs a SIGALRM handler.
# -ra: makes skips visible. 42 tests skip in CI and nothing reported it.
addopts = "--tb=short --strict-markers -ra --disable-socket --allow-unix-socket --timeout=60 --timeout-method=signal"
pythonpath = ["src", "."]
# Every marker in this list is APPLIED BY PATH — `integration`, `enable_socket` and
# `requires_network` in tests/integration/conftest.py, the rest in tests/conftest.py.
# Nothing is registered here that no test carries: that state is worse than having no
# marker at all, because it reads like protection. `integration` was exactly that for one
# release — registered, documented in CONTRIBUTING.md as THE credential-free run, carried
# by nobody, deselecting nothing while driving live Azure/Bedrock calls.
#
# Deliberately NOT registered, each proposed and then measured to zero on this tree:
#   component, e2e  no reproducible definition; the flat tests/unit tree gives nothing to
#                   key them on, and the census figures quoted for them (1,376 and 340)
#                   are not derivable from any path or content rule here. Left in a `-m`
#                   expression they deselect exactly 0 while reading as 1,716.
#   perf            tests/perf/test_query_latency.py collects 0 tests — it is a __main__
#                   script whose filename merely matches test_*.py.
#   contract, property, regression, flaky   carried by nobody today.
#
# NO COUNTS ARE WRITTEN HERE ON PURPOSE, and the one that was here is gone: the
# `integration` comment used to end "(104 deselected on the same tree)". Measured again,
# `pytest tests --collect-only -m "not integration"` reports 3990/4079 collected, 89
# deselected. The number had drifted — precisely the failure this taxonomy exists to
# prevent — so counts now live in tests/unit/test_marker_taxonomy.py where drift FAILS a
# run instead of misinforming a reader.
markers = [
    # This marker did not exist before, and no test carried it, so
    # CONTRIBUTING.md's documented credential-free run
    # `pytest -m "not integration"` deselected NOTHING — collection was
    # byte-identical to bare pytest (2,965 tests, 0 deselected when this was
    # fixed) and it drove the live Azure/Bedrock calls it claimed to skip.
    # It is now applied by directory in tests/integration/conftest.py rather
    # than by hand on each item, so a new file there is credential-gated on
    # arrival.
    "integration: hits a live service (Azure/Bedrock/network); needs credentials",
    # Referenced by the --disable-socket comment above and by tests/unit/conftest.py as
    # the documented escape hatch for a test that legitimately needs the network — and,
    # until now, NEITHER registered NOR carried. Under --strict-markers that made the
    # documented hatch a collection ERROR for whoever first tried to use it. Applied to
    # tests/integration/ alongside `integration`: coextensive with it today by
    # construction, kept separate so a future unit test that needs outbound traffic can
    # say so without also claiming to need credentials.
    "requires_network: needs outbound network; excluded from the hermetic unit run",
    # Applied to exactly the files carrying a MODULE-SCOPE pytest.importorskip, i.e. the
    # ones that vanish entirely when an optional extra is absent (pyvis, watchfiles,
    # litellm, lancedb). Per-test importorskip files are excluded: they still have work to
    # do without the extra.
    "requires_extra: whole file skips unless an optional extra is installed",
    # Node-level, not file-level: the two files involved also hold the portable fake-model
    # proofs that must run on a runner with no HuggingFace cache.
    "requires_weights: constructs a real published model from cached weights",
    # Measured file-level cost, not a guess — see tests/conftest.py for the command and
    # the threshold. FILE granularity, so fast tests inside a heavy file are tagged too;
    # the marker means "this file is expensive", not "this test is slow".
    "slow: file measured at >= 4.0s of call+setup+teardown",
    "cli: drives the Typer CLI (CliRunner or the installed console script)",
    "api: drives the FastAPI HTTP surface",
    "parser: exercises the tree-sitter language front-end",
    # Subject-is-a-security-control, by explicit table: authn/authz, path containment,
    # output escaping, secret redaction, audit tamper evidence, read-only enforcement,
    # remote-code gating, and the socket ban's own positive control.
    "security: the subject under test IS a security control",
    "e2e: spawns a real subprocess/venv/pip install — the full external-boundary path a mock cannot see",
]

[tool.coverage.run]
source = ["src/trelix"]
omit = ["tests/*"]
# Branch coverage. Line coverage counts whether a statement executed; it cannot see an
# `if` whose false arm is never taken, which for this codebase is most of the risk: an
# untaken `else` on a retrieval leg, an unexercised `except ImportError` fallback in the
# parser registry, a validator whose reject path never runs.
#
# Measured on this tree before enabling, so the gate move is not a guess:
#   line only            84.01%  (2,722 missing of 17,025 statements)
#   line + branch        80.76%  (5,960 branch destinations, 1,701 missing, 1,015 partial)
#   branch rate alone    71.46%
# So `fail_under = 79` below still clears by 1.76 points and does NOT need to move. That
# matters because an audit predicted the opposite -- it extrapolated the parser package's
# 64.86% branch rate to the whole tree and computed a 0.05-point margin. The parser
# package is the WORST-covered area in the repo, so using it as the estimator understated
# everything else. The number here is the whole tree, measured.
#
# Consequence to state plainly: the headline percentage drops from 84.01% to ~80.76% and
# is NOT comparable with any previously recorded figure. The denominator changed.
branch = true

[tool.coverage.report]
show_missing = true
# Was 75 while the unit suite measured 80.73% of 15,475 statements — 887 statements
# of free headroom, more than the whole retrieval package, could rot uncovered
# without anything failing. ci.yml already passes --cov-fail-under=79 to override
# this value and its comment asks in so many words for the config to be raised to
# match ("pyproject's fail_under stays 75 and now disagrees with CI; raise it to 79
# so a local `pytest --cov` fails for the same reason CI does"). That is done here.
#
# 79, not 80: the 1.7-point margin absorbs the one real source of drift, which is
# extras coverage. The CI unit job installs [local,otel,sso,dev] while the 80.73%
# was measured with every extra present, so import-guard fallbacks in the optional
# backends flip sides between the two environments. Going to 80 would gate on which
# extras happen to be installed. pytest-cov reads this key whenever coverage is
# collected, so it now also gates a bare local `pytest --cov`; the integration job's
# --cov-fail-under=0 still deliberately opts out, since unit and integration run on
# separate runners with no `coverage combine`.
fail_under = 79
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
